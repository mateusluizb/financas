// ---- leitura do QR Code (câmera ou foto) ----
let CAM = null, DEC = null;
async function decoder(){
  if (DEC) return DEC;
  if ('BarcodeDetector' in window){
    try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')){ const bd = new BarcodeDetector({formats:['qr_code']}); return DEC = async src => (await bd.detect(src))[0]?.rawValue || null; } } catch {}
  }
  if (!window.jsQR) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = res; s.onerror = () => rej(new Error('não consegui carregar o leitor de QR Code (precisa de internet)')); document.head.appendChild(s); });
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
  return DEC = async (src, max = 900) => {
    const w = src.videoWidth || src.naturalWidth || src.width, h = src.videoHeight || src.naturalHeight || src.height; if (!w || !h) return null;
    const sc = Math.min(1, max/Math.max(w, h)); cv.width = Math.round(w*sc); cv.height = Math.round(h*sc);
    cx.drawImage(src, 0, 0, cv.width, cv.height); const d = cx.getImageData(0, 0, cv.width, cv.height);
    return window.jsQR(d.data, d.width, d.height, {inversionAttempts:'attemptBoth'})?.data || null;
  };
}
async function abrirCam(){
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) return toast('A câmera ao vivo só funciona com o painel aberto em https ou neste computador. Use "Foto do QR Code", que funciona em qualquer lugar.', true);
  const v = $('#scan-v'), msg = $('#scan-msg');
  $('#scan').classList.add('on'); msg.textContent = 'Abrindo a câmera…';
  try {
    const dec = await decoder();
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}}, audio:false});
    CAM = {stream, on:true}; v.srcObject = stream; await v.play();
    msg.textContent = 'Aponte para o QR Code no rodapé da nota';
    const tick = async () => {
      if (!CAM?.on) return;
      try { if (v.readyState >= 2){ const r = await dec(v); if (r){ fecharCam(); processarQR(r); return; } } } catch {}
      setTimeout(tick, 160);
    };
    tick();
  } catch (e){
    fecharCam();
    toast(e.name === 'NotAllowedError' ? 'O acesso à câmera foi negado. Libere nas permissões do navegador ou use "Foto do QR Code".' : 'Não consegui abrir a câmera: '+e.message, true);
  }
}
function fecharCam(){
  if (CAM){ CAM.on = false; CAM.stream.getTracks().forEach(t => t.stop()); CAM = null; }
  $('#scan').classList.remove('on'); $('#scan-v').srcObject = null;
}
async function lerFoto(file){
  const u = URL.createObjectURL(file);
  try {
    const dec = await decoder(), img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('não consegui abrir essa imagem')); img.src = u; });
    let r = null; for (const max of [900, 1500, 2400]){ r = await dec(img, max); if (r) break; }
    if (!r) return toast('Não achei um QR Code nessa foto. Tente de mais perto, com boa luz e a nota bem esticada.', true);
    processarQR(r);
  } catch (e){ toast(e.message, true); }
  finally { URL.revokeObjectURL(u); }
}

// ---- gravação das notas ----
async function processarQR(txt){
  txt = String(txt || '').trim();
  if (!/^https?:\/\//i.test(txt)) return toast('Esse QR Code não contém o link de uma nota fiscal.', true);
  if (!/^https?:\/\/[^/?#]+\.gov\.br[/?#]/i.test(txt)) { state.scanRes = {erro:'o link lido não é de um site da Sefaz (.gov.br), então não parece ser de uma NFC-e'}; render(); return; }
  const url = state.settings.urlPagamentos;
  if (!url){ state.scanRes = {erro:'o QR Code foi lido, mas para buscar os itens o painel precisa do script de gravação publicado (Configurações)', link:txt}; go('mercado'); return; }
  state.scanRes = {busy:true}; if (state.screen === 'mercado') render(); else go('mercado');
  try {
    const r = await jsonp(url, {acao:'nfce', url:txt, token:state.settings.token || ''}, 70000);
    if (!r || !r.ok) throw new Error(r?.erro || 'resposta inesperada do script');
    state.mercLocal[r.nota.chave] = {...r.nota, sync:true}; save('mercLocal');
    state.scanRes = {ok:true, nota:r.nota, repetida:r.repetida};
    load();
  } catch (e){ state.scanRes = {erro:e.message, link:txt}; render(); }
}
async function enviarNota(nota){
  const url = state.settings.urlPagamentos; let res;
  const base = {chave:nota.chave, data:nota.data, loja:nota.loja};
  for (let i = 0; i < nota.itens.length; i += 20){
    const ult = i + 20 >= nota.itens.length;
    res = await jsonp(url, {acao:'itens', token:state.settings.token || '', dados:JSON.stringify({...base, desconto:ult ? nota.desconto || 0 : 0, itens:nota.itens.slice(i, i+20)})});
    if (!res || !res.ok) throw new Error(res?.erro || 'resposta inesperada do script');
  }
  if (state.mercLocal[nota.chave]){ state.mercLocal[nota.chave].sync = true; save('mercLocal'); }
  return res;
}
// Texto copiado da página da nota (layout padrão do Portal da NFC-e); se não casar, aceita linhas "PRODUTO ... 12,34"
function lerTextoNota(txt){
  const t = String(txt || '').replace(/\r/g, '').replace(/ /g, ' ');
  const itens = [];
  const re = /([^\n(]{2,}?)\s*\(\s*C[óo]d(?:igo)?\.?:?\s*([^)]*?)\s*\)\s*Qtde\.?:?\s*([\d.,]+)\s*UN:?\s*([A-Za-z]{1,4})\s*Vl\.?\s*Unit\.?:?\s*([\d.,]+)\s*Vl\.?\s*Total:?\s*([\d.,]+)/gi;
  let m;
  while ((m = re.exec(t))){
    let nome = m[1].trim(); if (nome.length > 80) nome = nome.slice(-80).replace(/^\S*\s/, '');
    itens.push({n:itens.length+1, item:nome, cod:m[2].trim(), qtd:parseNum(m[3]) ?? 1, un:m[4].toUpperCase(), unit:parseNum(m[5]), total:parseNum(m[6]) ?? 0});
  }
  if (!itens.length) t.split('\n').forEach(l => {
    const x = l.trim().match(/^(.*[A-Za-zÀ-ú].*?)\s+(?:R\$\s*)?(-?\d{1,3}(?:\.\d{3})*,\d{2})$/);
    if (x && !/TOTAL|PAGAR|DESCONTO|TROCO|CART[AÃ]O|DINHEIRO|\bPIX\b|TRIBUTO|SUBTOTAL|CR[EÉ]DITO|D[EÉ]BITO|VALOR/i.test(x[1])) itens.push({n:itens.length+1, item:x[1].trim(), cod:'', qtd:1, un:'UN', unit:parseNum(x[2]), total:parseNum(x[2])});
  });
  const linhas = t.split('\n').map(l => l.trim()).filter(Boolean);
  const loja = linhas.find(l => /[A-Za-z]{3}/.test(l) && !/DOCUMENTO AUXILIAR|NFC-?E|CONSULTA|NOTA FISCAL|CNPJ|^\(/i.test(l)) || '';
  const em = t.match(/Emiss[ãa]o:?\s*(\d{2}\/\d{2}\/\d{4})/i) || t.match(/(\d{2}\/\d{2}\/\d{4})/);
  const desc = t.match(/Descontos?\s*R\$:?\s*([\d.,]+)/i);
  let chave = ((t.match(/(?:\d{4}\s?){11}/) || [''])[0]).replace(/\s/g, '');
  if (chave.length !== 44){ let h = 0; for (const c of loja + (em?.[1] || '') + itens.map(i => i.item + i.total).join()) h = (h*31 + c.charCodeAt(0)) | 0; chave = 'manual-' + (h >>> 0).toString(36); }
  return {loja:loja.slice(0, 80), data:em ? em[1] : fmtD(TODAY), chave, desconto:desc ? parseNum(desc[1]) || 0 : 0, itens};
}
async function setMercCat(pares){

}

// ---- gravações (idempotentes por CHAVE: registrar de novo atualiza, nunca duplica) ----
function jsonpRaw(url, params = {}, timeout = 25000){
  return new Promise((resolve, reject) => {
    const cb = '__fin' + Date.now() + Math.floor(Math.random()*1e6), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error('tempo esgotado')); }, timeout);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error('falha ao carregar o script')); };
    s.src = url + (url.includes('?') ? '&' : '?') + new URLSearchParams({...params, callback:cb});
    document.head.appendChild(s);
  });
}
// todo pedido aos scripts leva o comprovante de login; uma recusa por login vencido tenta de novo uma vez
async function jsonp(url, params = {}, timeout){
  if (!AUTH_ON) return jsonpRaw(url, params, timeout);
  for (let tent = 0; ; tent++){
    let idt;
    try { idt = await idToken(); } catch (e){ bloquear('expirou'); throw e; }
    const d = await jsonpRaw(url, {...params, idt}, timeout);
    if (!d || !d.acesso) return d;
    if (d.acesso === 'negado'){ bloquear('negado', d.email); throw new AuthErr('negado'); }
    auth = null; LS.set('auth', null);                       // comprovante recusado: pede outro
    if (tent){ bloquear('expirou'); throw new AuthErr('login'); }
  }
}
async function registrar(row, okMsg){
  row = {STATUS:'ATIVO', OBS:'', ...row, 'DATA REGISTRO': new Date().toISOString()};
  state.local[row.CHAVE] = row; save('local'); render();
  const url = state.settings.urlPagamentos;
  if (!url){ toast(okMsg+' (salvo só neste navegador)'); return; }
  try {
    const r = await jsonp(url, {chave:row.CHAVE, tipo:row.TIPO, referencia:row.REFERENCIA, valor:row.VALOR, banco:row.BANCO, data:row.DATA, status:row.STATUS, obs:row.OBS, registro:row['DATA REGISTRO'], token:state.settings.token || ''});
    if (!r || !r.ok) throw new Error(r?.erro || 'resposta inesperada');
    toast(okMsg+' · gravado na planilha');
  } catch (e){ toast('Não consegui gravar na planilha ('+e.message+'). Ficou salvo neste navegador.', true); }
}

    auth = null; LS.set('auth', null); try { localStorage.removeItem('fin.cache'); } catch {}
    closeModal(); fecharCam(); RAW = null; M = null; $('#content').innerHTML = ''; $('#side').innerHTML = '';
    bloquear('saiu');
  },
  pmode(t){ state.period.mode = t.dataset.m; save('period'); render(); },
  pstep(t){ state.period.ym = ymAdd(state.period.ym, +t.dataset.d); save('period'); render(); },
  irMes(t){ state.period = {...state.period, mode:'month', ym:t.dataset.ym}; save('period'); go('visao'); },
  ano(t){ state.ano = (state.ano ?? +refMonth().slice(0,4)) + +t.dataset.d; render(); },
  clearF(t){ state.F[t.dataset.k] = ''; render(); },
  setF(t){ state.F[t.dataset.k] = state.F[t.dataset.k] === t.dataset.v ? '' : t.dataset.v; render(); },
  verCartao(t){ state.card = t.dataset.cartao; save('card'); state.despTab = 'fat'; save('despTab'); go('despesas'); },
  dismiss(t){ state.dismissed.push(t.dataset.id); save('dismissed'); render(); },
  undismiss(){ state.dismissed = []; save('dismissed'); render(); },
  pagar(t){
    const f = t.closest('.payform'), valor = parseNum(f.querySelector('.pf-valor').value), d = parseDate(f.querySelector('.pf-data').value), banco = f.querySelector('.pf-banco').value;
    if (valor == null || !d) return toast('Confira o valor e a data do pagamento.', true);
    registrar({CHAVE:f.dataset.chave, TIPO:'FATURA', REFERENCIA:f.dataset.cartao+' · venc. '+fmtD(parseDate(f.dataset.venc)), VALOR:valor, BANCO:banco, DATA:fmtD(d)}, 'Fatura marcada como paga');
  },
  despagar(t){ const w = W[t.dataset.chave]; if (w) registrar({...w, STATUS:'CANCELADO'}, 'Pagamento desfeito'); },
  receber(t){ const {desc, ym, valor, banco, dia} = t.dataset; const [y, m] = ym.split('-').map(Number); const d = mkDate(y, m-1, +dia); registrar({CHAVE:'receb_'+ym+'_'+nk(desc).replace(/\W+/g, '_'), TIPO:'RECEBIDO', REFERENCIA:ym, VALOR:+valor, BANCO:banco, DATA:fmtD(d > TODAY ? TODAY : d), OBS:desc}, desc+' marcado como recebido'); },
  desreceber(t){ const w = W[t.dataset.chave]; if (w) registrar({...w, STATUS:'CANCELADO'}, 'Marcação desfeita'); },
  conferir(t){ const f = FATS.find(x => x.chave === t.dataset.chave); const txt = $('#conf-txt').value; if (!f || !txt.trim()) return toast('Cole o texto da fatura primeiro.', true); state.conf[f.chave] = conferirFatura(txt, f); state.open['fat-conf'] = true; render(); },
  salvarFech(t){
    const n = t.dataset.cartao, v = $('#fechConf').value, c = (state.settings.cartoes[n] ||= {});
    if (v && c.fechConf && c.fechConf !== v) c.fechAnt = c.fechConf;
    c.fechConf = v; save('settings'); render(); toast(v ? 'Fechamento confirmado em '+fmtD(parseDate(v)) : 'Confirmação removida');
  },
  conferirSaldo(t){
    const n = t.dataset.conta, c = CONTAS.find(x => x.nome === n), real = parseNum(document.getElementById('real-'+n).value);
    if (real == null) return toast('Digite o saldo que aparece no app do banco.', true);
    const diff = real - c.calc.saldo; state.confSaldo[n] = {real, diff};
    registrar({CHAVE:'conf_'+n, TIPO:'CONFERENCIA', REFERENCIA:n, VALOR:real, BANCO:n, DATA:fmtD(TODAY), OBS:'calculado '+fmt(c.calc.saldo)+' · diferença '+fmt(diff)}, 'Conferência registrada');
  },
  reancorar(t){ const n = t.dataset.conta, cf = state.confSaldo[n]; if (!cf) return; delete state.confSaldo[n]; registrar({CHAVE:'ancora_'+n, TIPO:'ANCORA', REFERENCIA:n, VALOR:cf.real, BANCO:n, DATA:fmtD(TODAY), OBS:'reancorado pela conferência'}, 'Novo ponto de partida: '+fmt(cf.real)); },
  saveCfg(t){
    const s = state.settings;
    document.querySelectorAll('[data-cfg]').forEach(el => {
      const path = JSON.parse(el.dataset.cfg); let o = s;
      path.slice(0, -1).forEach(k => o = (o[k] ||= {}));
      o[path.at(-1)] = el.value.trim();
    });
    save('settings'); toast('Configurações salvas');
    if (t.dataset.reload) load(); else render();
  },
  mtab(t){ state.mTab = t.dataset.t; save('mTab'); state.MQ.q = ''; render(); },
  mso(t){ state.MQ.so = t.dataset.v; render(); },
  abrirCam, fecharCam,
  foto(){ $('#qr-file').click(); },
  linkNota(){ const v = $('#nota-link').value.trim(); if (!v) return toast('Cole o link do QR Code primeiro.', true); processarQR(v); },
  limparScan(){ state.scanRes = null; render(); },
  async colarNota(){
    const nota = lerTextoNota($('#nota-txt').value);
    if (!nota.itens.length) return toast('Não reconheci itens nesse texto. Copie a página inteira da nota no site da Sefaz.', true);
    state.mercLocal[nota.chave] = {...nota, sync:false}; save('mercLocal');
    if (!state.settings.urlPagamentos){ state.scanRes = {ok:true, nota, local:true}; render(); return; }
    state.scanRes = {busy:true, msg:'Gravando os itens na planilha…'}; render();
    try { const r = await enviarNota(nota); state.scanRes = {ok:true, nota, repetida:r.repetida}; load(); }
    catch (e){ state.scanRes = {ok:true, nota, local:true}; render(); toast('Não consegui gravar na planilha ('+e.message+'). Ficou salvo neste navegador.', true); }
  },
  async enviarNota(t){
    const n = state.mercLocal[t.dataset.chave]; if (!n) return;
    if (!state.settings.urlPagamentos) return toast('Publique o script de gravação e informe a URL em Configurações.', true);
    try { await enviarNota(n); toast('Nota gravada na planilha'); load(); } catch (e){ toast('Não consegui gravar ('+e.message+').', true); }
  },
  aceitarUm(t){ setMercCat([[t.dataset.p, t.dataset.c]]); },
  aceitarSug(){ setMercCat(produtos(mercado().rows).filter(p => p.auto).map(p => [p.nome, p.cat])); },
  limparLocal(){ if (!confirm('Apagar as marcações (faturas pagas, recebidos, conferências) salvas só neste navegador? O que já foi gravado na planilha continua lá.')) return; state.local = {}; save('local'); render(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-act],[data-xp],[data-tab]'); if (!t) return;
  if (t.dataset.nav){ e.preventDefault(); go(t.dataset.nav); return; }
  if (t.dataset.tab){ state.despTab = t.dataset.tab; save('despTab'); render(); return; }
  if (t.dataset.act){ const fn = ACT[t.dataset.act]; if (fn){ e.preventDefault(); fn(t, e); } return; }
  if (t.dataset.xp) openXp(t.dataset.xp);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeModal(); fecharCam(); document.body.classList.remove('drawer'); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'nota-link') ACT.linkNota(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f && t.dataset.f !== 'q'){ state.F[t.dataset.f] = t.value; render(); }
  else if (t.dataset.rf === 'banco'){ state.RF.banco = t.value; render(); }
  else if (t.dataset.per){ state.period[t.dataset.per] = t.value; save('period'); render(); }
  else if (t.dataset.mf != null){ state.MQ.cat = t.value; render(); }
  else if (t.dataset.mcat != null){
    let c = t.value;
    if (c === '__nova'){ c = (prompt('Nome da nova categoria:') || '').trim(); if (!c){ render(); return; } }
    if (c) setMercCat([[t.dataset.mcat, c]]);
  }
  else if (t.id === 'qr-file'){ const f = t.files[0]; t.value = ''; if (f) lerFoto(f); }
});
let qT;
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.f === 'q' ? ['F', '[data-f="q"]'] : t.dataset.rf === 'q' ? ['RF', '[data-rf="q"]'] : t.dataset.mq != null ? ['MQ', '[data-mq]'] : null; if (!k) return;
  state[k[0]].q = t.value; clearTimeout(qT); qT = setTimeout(() => { state.focus = k[1]; render(); }, 250);
});
// lembra seções abertas/fechadas entre re-renderizações
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-k]')){ state.open[d.dataset.k] = d.open; save('open'); if (d.open) flushCharts(); } }, true);
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => charts.forEach(c => c.resize()), 150); });

// ---- acesso: login com Google (Google Identity Services) ----
// O painel só guarda o comprovante (ID token, vale 1 hora). Quem decide o acesso
// são os scripts: conferem o comprovante com o Google e o e-mail na aba _ACESSO.
const AUTH_ON = !!PUBLICO.clientId;
class AuthErr extends Error { constructor(tipo){ super(tipo === 'negado' ? 'e-mail sem acesso' : 'login necessário'); this.tipo = tipo; } }
let auth = AUTH_ON ? LS.get('auth', null) : null, gisP = null, credWait = [];
const jwtDados = t => { try { const b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch { return null; } };
const credValida = () => !!auth && auth.exp - Date.now() > 120000;
function carregarGis(){
  return gisP ||= new Promise((ok, no) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => { google.accounts.id.initialize({client_id:PUBLICO.clientId, callback:r => onCredencial(r.credential), auto_select:true, cancel_on_tap_outside:false, use_fedcm_for_prompt:true}); ok(); };
    s.onerror = () => { gisP = null; s.remove(); no(new Error('Não consegui carregar o login do Google.')); };
    document.head.appendChild(s);
  });
}
function onCredencial(cred){
  const d = jwtDados(cred); if (!d?.email) return;
  auth = {cred, email:String(d.email).toLowerCase(), exp:d.exp*1000}; LS.set('auth', auth);
  const w = credWait; credWait = []; w.forEach(f => f(cred));
  if (document.body.classList.contains('locked')){ document.body.classList.remove('locked'); load(); }
}
// comprovante válido; vencido → pede outro ao Google em silêncio (auto_select)
async function idToken(){
  if (credValida()) return auth.cred;
  await carregarGis();
  return new Promise((ok, no) => {
    const fim = err => { clearTimeout(t); credWait = credWait.filter(f => f !== fn); err ? no(err) : 0; };
    const fn = c => { clearTimeout(t); ok(c); };
    const t = setTimeout(() => fim(new AuthErr('login')), 12000);
    credWait.push(fn);
    google.accounts.id.prompt(n => { try { if (n.isNotDisplayed?.() || n.isSkippedMoment?.() || (n.isDismissedMoment?.() && n.getDismissedReason?.() !== 'credential_returned')) fim(new AuthErr('login')); } catch {} });
  });
}
function bloquear(tipo, email){
  document.body.classList.add('locked'); document.body.classList.remove('drawer');
  $('#login-t').textContent = state.settings.familia || 'Finanças da família';
  const msg = $('#login-msg');
  msg.className = 'login-msg' + (tipo === 'negado' || tipo === 'erro' ? ' err' : '');
  msg.textContent = tipo === 'negado' ? `A conta ${email || ''} não tem acesso a este painel. Entre com outra conta ou peça para incluírem este e-mail na aba _ACESSO da planilha.`
    : tipo === 'expirou' ? 'Sua sessão expirou. Entre de novo para continuar.'
    : tipo === 'saiu' ? 'Você saiu do painel.' : '';
  if (tipo === 'negado'){ auth = null; LS.set('auth', null); try { localStorage.removeItem('fin.cache'); } catch {} RAW = null; M = null; $('#content').innerHTML = ''; }
  carregarGis().then(() => {
    if (tipo === 'negado') google.accounts.id.disableAutoSelect();
    $('#g-btn').innerHTML = '';
    google.accounts.id.renderButton($('#g-btn'), {theme:state.theme === 'dark' ? 'filled_black' : 'outline', size:'large', shape:'pill', text:'signin_with', locale:'pt-BR', width:260});
    if (tipo === 'login' || tipo === 'expirou') google.accounts.id.prompt();
  }).catch(e => { msg.className = 'login-msg err'; msg.textContent = e.message+' Confira a internet e recarregue a página.'; });
}

// ---- carga ----
async function load(){
  if (AUTH_ON && !auth){ bloquear('login'); return; }
  const url = state.settings.urlLeitura;
  state.loading = true; state.loadErr = null; if (M) renderSide();
  if (!url){ RAW = demoData(); }
  else {
    try { RAW = await jsonp(url); if (!RAW || !RAW.sheets) throw new Error(RAW?.erro || 'resposta sem abas'); LS.set('cache', RAW); }
    catch (e){ if (e instanceof AuthErr){ state.loading = false; return; } state.loadErr = e.message; RAW = LS.get('cache', null) || demoData(); toast('Não consegui ler a planilha: '+e.message+(LS.get('cache', null) ? ' — mostrando a última cópia salva' : ' — mostrando dados de demonstração'), true); }
  }
  state.loading = false;
  M = buildModel(RAW);
  // o que já chegou à planilha deixa de ser "só deste navegador"
  const chs = new Set(M.mercado.map(r => r.chave));
  for (const k of Object.keys(state.mercLocal)) if (chs.has(k)) delete state.mercLocal[k];
  for (const [k, v] of Object.entries(state.mercCat)) if (v.sync && M.mercCat[k] === v.cat) delete state.mercCat[k];
  save('mercLocal'); save('mercCat');
  render();
}
$('#burger').innerHTML = ico('menu'); $('#m-x').innerHTML = ico('x');
document.documentElement.dataset.theme = state.theme;
load();
</script>
