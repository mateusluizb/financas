<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças da Família</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#f5f0e6; --surface:#fffdf8; --surface-2:#efe8da; --border:#e2d8c5; --border-soft:#eee6d6;
  --text:#2a2a22; --muted:#7a7262;
  --primary:#2f5d46; --primary-soft:#e2ebe3; --accent:#b5583a;
  --green:#3f7d4e; --amber:#a8741a; --red:#b23b2e; --blue:#3d6a8a;
  --hero-a:#2f5d46; --hero-b:#213f31; --hero-ink:#f6f1e7;
  --c1:#2f5d46; --c2:#b5583a; --c3:#3d6a8a; --c4:#c39a3a; --c5:#7a5a85; --c6:#7f8c4a; --c7:#3f8a86; --c8:#a85d6e; --c9:#8a7a5f; --c10:#5f6f7a;
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#161915; --surface:#1e221d; --surface-2:#282d26; --border:#343a31; --border-soft:#2b3029;
  --text:#ece6d8; --muted:#a19b8a;
  --primary:#86b896; --primary-soft:#26372c; --accent:#dd8f70;
  --green:#7fc28f; --amber:#e0b25a; --red:#e57b6e; --blue:#89b4d2;
  --hero-a:#26402f; --hero-b:#1a2b21; --hero-ink:#f1ebdd;
  --c1:#86b896; --c2:#dd8f70; --c3:#89b4d2; --c4:#e0bf6a; --c5:#b89cc2; --c6:#b5c27e; --c7:#7cc3be; --c8:#d7909f; --c9:#c4b393; --c10:#9fb0bb;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--primary)}
.serif{font-family:'Source Serif 4',Georgia,serif}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.ico{width:18px;height:18px;flex:none}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{width:252px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px 18px}
.brand{font-family:'Source Serif 4',Georgia,serif;font-size:21px;font-weight:600;padding:0 10px 10px;line-height:1.2}
.brand small{display:block;font-family:'Inter',sans-serif;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}
.nav-g{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);display:grid;gap:12px}
.side-foot label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.foot-row{display:flex;gap:8px;align-items:center}
.status{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.demo{background:var(--amber)}.dot.err{background:var(--red)}

/* main */
main{flex:1;min-width:0}
.content{max-width:1240px;margin:0 auto;padding:34px 38px 90px;display:grid;gap:28px}
.topbar{display:none}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-h h1{font-family:'Source Serif 4',Georgia,serif;font-size:32px;font-weight:600;margin:0;line-height:1.1;letter-spacing:-.01em}
.page-h p{margin:6px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;min-width:0}
.card h2,.h2{font-size:15px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:10px}
.card h2 .r,.h2 .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2.dia{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (max-width:1150px){.grid2.dia{grid-template-columns:1fr}}
.stack{display:grid;gap:14px}

.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:16px;padding:28px 30px;display:grid;grid-template-columns:1.5fr 1fr;gap:28px;box-shadow:0 14px 34px -16px rgba(25,45,35,.55)}
.hero .lbl{font-size:13px;opacity:.78}
.hero .big{font-family:'Source Serif 4',Georgia,serif;font-size:50px;font-weight:600;line-height:1.05;margin:6px 0 8px;letter-spacing:-.015em}
.hero .sub{opacity:.85;font-size:14px}
.hero-r{border-left:1px solid rgba(255,255,255,.18);padding-left:28px;display:grid;gap:14px;align-content:center}
.hero-r b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600;line-height:1.15}
.hero-r small{opacity:.75;font-size:12.5px}
.hero [data-xp]{cursor:pointer}
.hero [data-xp]:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.kpi.click{cursor:pointer;transition:border-color .15s}
.kpi.click:hover{border-color:var(--primary)}
.kpi-l{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.kpi-v{font-family:'Source Serif 4',Georgia,serif;font-size:27px;font-weight:600;margin-top:4px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi-s[data-xp]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.why{font-size:11px;color:var(--primary);opacity:0;transition:opacity .15s;white-space:nowrap}
.kpi:hover .why{opacity:1}
.spark{width:100%;height:28px;margin-top:10px;color:var(--primary);display:block;opacity:.85}

details.sec{background:var(--surface);border:1px solid var(--border);border-radius:14px}
details.sec>summary{list-style:none;cursor:pointer;padding:15px 22px;display:flex;align-items:center;gap:12px;font-weight:600;user-select:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .meta{margin-left:auto;color:var(--muted);font-weight:400;font-size:13px}
details.sec>summary .ico{transition:transform .2s;color:var(--muted)}
details.sec[open]>summary .ico{transform:rotate(180deg)}
.sec-body{padding:2px 22px 20px}
details.mini>summary{cursor:pointer;color:var(--muted);font-size:13px}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
.t td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tfoot td{font-weight:600;border-top:1px solid var(--border)}
.num{text-align:right!important;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow:auto;max-height:560px;margin:0 -10px}
.tbl-wrap.free{max-height:none}
.badge{display:inline-block;font-size:11px;line-height:1.6;padding:0 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:6px;white-space:nowrap;font-weight:500}
.badge.red{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.badge.amber{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.badge.green{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.badge.blue{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar>i.over{background:var(--red)}.bar>i.near{background:var(--amber)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.hbar{display:flex;gap:4px;align-items:center}
.hbar i{display:block;height:7px;border-radius:99px}

.alerts{display:grid;gap:10px}
.alert{display:flex;gap:14px;align-items:flex-start;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);border-left:4px solid var(--muted)}
.alert.red{border-left-color:var(--red)}.alert.amber{border-left-color:var(--amber)}.alert.green{border-left-color:var(--green)}.alert.blue{border-left-color:var(--blue)}
.alert .tt{font-weight:600}
.alert .dd{color:var(--muted);font-size:13.5px}
.alert .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--primary);padding:2px 4px}
input,select,textarea{font:inherit;font-size:13.5px;color:inherit;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 40%,transparent);outline-offset:0;border-color:var(--primary)}
textarea{width:100%;min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.field{display:grid;gap:4px}
.field>span{font-size:12px;color:var(--muted)}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.payform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.payform input.v{width:110px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-size:12.5px;font-weight:500}
.chip button{border:0;background:none;cursor:pointer;color:inherit;display:flex;padding:1px}
.chip .ico{width:14px;height:14px}
.pill{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px}
.pill.on{background:var(--text);color:var(--surface);border-color:var(--text)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--text);border-bottom-color:var(--primary)}

.chart{position:relative;height:260px}
.chart.sm{height:200px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13.5px}
.heat td{font-size:12px;text-align:right;padding:6px 8px;white-space:nowrap}
.heat td:first-child{text-align:left}
.ring{display:block}
.meta-card{display:flex;gap:18px;align-items:center}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.pace{display:grid;gap:8px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,20,15,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:16px;width:min(680px,100%);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.modal-h h3{margin:0;font-size:17px}
.modal-h .x{margin-left:auto;border:0;background:none;cursor:pointer;color:var(--muted);padding:2px}
.modal-b{padding:6px 22px 20px;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:200;max-width:90vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}
.scrim{display:none}
/* mercado: leitor de QR */
.scan-bg{position:fixed;inset:0;background:rgba(10,10,8,.88);z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
.scan-bg.on{display:flex}
.scan-box{position:relative;width:min(480px,100%);aspect-ratio:3/4;max-height:68vh;border-radius:16px;overflow:hidden;background:#000}
.scan-box video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;left:50%;top:50%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-msg{color:#fff;font-size:14px;text-align:center;max-width:420px}
.add-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.add-acts .form-row{flex:1 1 300px;flex-wrap:nowrap}
.add-acts input{flex:1}
.t select{max-width:190px}

@media (max-width:1150px){
  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-r{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.18);padding-top:18px}
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:860px){
  .side{position:fixed;z-index:60;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .topbar{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar .btn{border:0;padding:6px}
  .topbar b{font-family:'Source Serif 4',Georgia,serif;font-size:17px}
  .topbar span{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .content{padding:22px 16px 70px;gap:22px}
  .page-h h1{font-size:26px}
  .hero{padding:22px}
  .hero .big{font-size:40px}
  .alert{flex-wrap:wrap}
  .alert .act{margin-left:0;justify-content:flex-start}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:88vh;border-radius:18px 18px 0 0}
  .card{padding:18px 16px}
  .sec-body{padding:2px 16px 18px}
  details.sec>summary{padding:14px 16px}
}
@media (max-width:520px){
  .kpis,.kpis.k3,.kpis.k5{grid-template-columns:1fr}
  .hero .big{font-size:36px}
  .hide-sm{display:none}
  [data-sm]{display:block!important}
}
.login{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;place-items:center;padding:16px}
body.locked .login{display:grid}
body.locked .app,body.locked .toast{display:none}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px;justify-items:center}
.login-card h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:26px;margin:0;color:var(--text)}
.login-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.login-lock{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.login-lock svg{width:22px;height:22px}
#g-btn{min-height:44px}
.login-msg{font-size:13px;line-height:1.5;border-radius:10px;padding:10px 12px;background:var(--surface-2);color:var(--text);text-align:left;width:100%}
.login-msg.err{background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red)}
.login-msg:empty{display:none}
.side-user{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="login" id="login" role="dialog" aria-labelledby="login-t"><div class="login-card">
  <div class="login-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h1 id="login-t">Finanças da família</h1>
  <p>Acesso restrito. Entre com uma conta Google autorizada.</p>
  <div id="g-btn"></div>
  <div class="login-msg" id="login-msg"></div>
</div></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" data-act="menu"></div>
  <main>
    <div class="topbar"><button class="btn" data-act="menu" aria-label="Abrir menu" id="burger"></button><b id="tb-title">Finanças</b><span id="tb-period"></span></div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-bg" id="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><div><h3 id="m-title"></h3><div class="note" id="m-note"></div></div><button class="x" data-act="closeModal" aria-label="Fechar" id="m-x"></button></div><div class="modal-b" id="m-body"></div></div></div>
<div class="toast" id="toast"></div>
<div class="scan-bg" id="scan"><div class="scan-box"><video id="scan-v" playsinline muted autoplay></video><div class="scan-frame"></div></div><div class="scan-msg" id="scan-msg"></div><button class="btn" data-act="fecharCam">Cancelar</button></div>
<input type="file" id="qr-file" accept="image/*" capture="environment" hidden>

<script>
'use strict';
/* =====================================================================
   Dashboard financeiro familiar — arquivo único, sem build.
   A planilha do Google Sheets é a fonte da verdade: este painel só lê
   (script de leitura via JSONP) e grava apenas marcações de pagamento /
   conferência (script de pagamentos, também via JSONP).
   ===================================================================== */

// ---------- publicação (preencha antes de subir para o GitHub Pages) ----------
// Com clientId preenchido o painel só abre depois do login com Google, e os
// scripts só respondem a e-mails listados na aba _ACESSO da planilha.
// Vazio = sem login (uso local / dados de demonstração).
const PUBLICO = {
  clientId: '211462652861-g4kt118dthj5fo5dt0alparjkimamsab.apps.googleusercontent.com',        // ID do cliente OAuth (termina em .apps.googleusercontent.com)
  urlLeitura: 'https://script.google.com/macros/s/AKfycbw8EV1TelEBV4vlL1o3eY3iY-KXw0qwhBR0ELjIdDhlfO-BVO6ZUWUhOabAk1GZ04adcQ/exec',      // URL /exec do Leitura.gs
  urlPagamentos: 'https://script.google.com/macros/s/AKfycbww3ayRUtjEkikec8TOnU_oOng_bovPCHR-i6o1184nFrb56cX_14bPkjkSnn3_7pbp3Q/exec',   // URL /exec do Pagamentos.gs
};

// ---------- ícones (traço único) ----------
const P = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',

// Compacta valores grandes preservando o sinal (testado com negativos: fmtK(-48100) → "−R$ 48,1 mil")
function fmtK(v){
  v = v || 0; const s = v < 0 ? '−' : ''; const a = Math.abs(v);
  if (a >= 1e6) return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';
  if (a >= 1e4) return s+'R$ '+(a/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';
  return s+BRL.format(a);
}

const nk = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim().replace(/\s+/g,' ');

// Data digitada → Date. Retorna null se inválida (nunca deixa "32/13/2026" virar outro mês calado).
function parseDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
  const s = String(v).trim(); let y, m, d, mm;
  if ((mm = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})\b/))) { d=+mm[1]; m=+mm[2]; y=+mm[3]; if (y < 100) y += 2000; }
  else if ((mm = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y=+mm[1]; m=+mm[2]; d=+mm[3]; }
  else return null;
  const dt = new Date(y, m-1, d);
  // new Date() "estoura" silenciosamente para o mês seguinte com dia/mês inválido — conferir
  if (dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return dt;
}
// "R$ 1.234,56", "1234.56", "-12,5", "(30,00)" → número
function parseNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (v == null) return null;
  let s = String(v).trim(); if (!s) return null;
  const neg = /^\(.*\)$/.test(s) || /^[-−]|[-−]\s*R?\$/.test(s) || /^R\$\s*[-−]/.test(s);
  s = s.replace(/[^\d.,]/g, ''); if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if ((s.match(/\./g)||[]).length > 1 || /^\d{1,3}\.\d{3}$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); if (!isFinite(n)) return null;
  return neg ? -n : n;
}
function normForma(f){
  const k = nk(f); if (!k) return 'Outro';
  if (k.includes('CRED')) return 'Crédito';
  if (k.includes('PIX')) return 'PIX';
  if (k.includes('DEB')) return 'Débito';
  if (k.includes('BOLETO')) return 'Boleto';
  if (k.includes('DINH') || k.includes('ESPECIE')) return 'Dinheiro';
  return String(f).trim();
}
function parseYmHeader(k){
  let m;
  if ((m = k.match(/^(\d{4})-(\d{1,2})$/))) return m[1]+'-'+pad(+m[2]);
  if ((m = k.match(/^(\d{1,2})\/(\d{2}|\d{4})$/))) return (m[2].length === 2 ? '20'+m[2] : m[2])+'-'+pad(+m[1]);
  const d = parseDate(k); if (d) return ymOf(d);
  if ((m = k.match(/^([A-Z]{3})[A-Z]*\.?(?:[\/ -](\d{2}|\d{4}))?$/))) {
    const i = MES_NK.indexOf(m[1]); if (i < 0) return null;
    const y = m[2] ? (m[2].length === 2 ? '20'+m[2] : m[2]) : TODAY.getFullYear();
    return y+'-'+pad(i+1);
  }
  return null;
}

// =====================================================================
//  Modelo: converte as abas (lidas pelo NOME do cabeçalho) em listas tipadas
// =====================================================================
function normRaw(raw){
  const S = {};
  for (const [name, blocks] of Object.entries(raw.sheets || {}))
    S[nk(name)] = (blocks || []).map(b => (b || []).map(r => { const o = {}; for (const [k,v] of Object.entries(r)) o[k === '_LINHA' ? k : nk(k)] = v; return o; }));
  return S;
}
// Procura, nas abas indicadas (e depois em qualquer aba), o primeiro bloco que tenha todas as colunas pedidas
function findBlock(S, names, keys, notKeys = []){
  const ok = b => b.length && keys.every(k => k in b[0]) && !notKeys.some(k => k in b[0]);
  for (const n of names) for (const b of (S[nk(n)] || [])) if (ok(b)) return b;
  for (const blocks of Object.values(S)) for (const b of blocks) if (ok(b)) return b;
  return [];
}
const str = v => String(v ?? '').trim();

function buildModel(raw){
  const S = normRaw(raw);
  const M = { despesas:[], recorrentes:[], receitas:[], transf:[], rateios:[], inv:{tot:[], ext:[], snap:[]}, orc:{}, orcPadrao:{}, config:[], metas:[], pagSheet:[], issues:[], geradoEm:raw.geradoEm, demo:!!raw.demo, planilha:raw.planilha };
  const issue = (aba, linha, msg, sev='warn') => M.issues.push({id: aba+':'+linha+':'+msg, aba, linha, msg, sev});
  const L = r => r._LINHA ?? '?';
  let uid = 0;

  // RATEIOS (contas rachadas): o valor de terceiros é uma dimensão separada, nunca subtraída no lançamento
  const ratById = {};
  findBlock(S, ['RATEIOS'], ['ID','VALOR A RECEBER']).forEach(r => {
    const id = str(r.ID); if (!id) return;
    const v = parseNum(r['VALOR A RECEBER']);
    if (v == null){ issue('RATEIOS', L(r), `Rateio "${id}" sem valor a receber válido`); return; }
    (ratById[id] ||= []).push({id, valor:v, deQuem: str(r['DE QUEM']) || '—', recebido: !!str(r.RECEBIDO), linha:L(r)});
  });

  // DESPESAS pontuais (uma linha por compra; parcelado = uma linha com PARCELA "k/n" e VALOR da parcela)
  const dupKey = {};
  findBlock(S, ['DESPESAS'], ['DATA','VALOR'], ['DIA']).forEach(r => {
    const desc = str(r.DESCRICAO), linha = L(r);
    if (!desc && !str(r.DATA) && !str(r.VALOR)) return;
    const d = parseDate(r.DATA);
    if (!d){ issue('DESPESAS', linha, `Data inválida "${str(r.DATA) || 'vazia'}" em "${desc || 'sem descrição'}" — o lançamento ficou fora de todos os cálculos`, 'err'); return; }
    const v = parseNum(r.VALOR);
    if (v == null){ issue('DESPESAS', linha, `Valor vazio ou ilegível ("${str(r.VALOR)}") em "${desc}" de ${fmtD(d)} — ficou fora dos cálculos`, 'err'); return; }
    if (v === 0) issue('DESPESAS', linha, `Valor zerado em "${desc}" de ${fmtD(d)}`);
    if (v < 0) issue('DESPESAS', linha, `Valor negativo (${fmt(v)}) em "${desc}" — se é estorno, tudo bem`);
    const cat = str(r.CATEGORIA), banco = str(r.BANCO);
    if (!cat) issue('DESPESAS', linha, `Sem categoria: "${desc}" de ${fmt(v)} em ${fmtD(d)}`);
    if (!banco) issue('DESPESAS', linha, `Sem banco: "${desc}" de ${fmt(v)} em ${fmtD(d)}`);
    const parc = str(r.PARCELA);
    if (d > addMonths(TODAY, 1) && !parc) issue('DESPESAS', linha, `Data no futuro (${fmtD(d)}) em "${desc}" — confira o ano`);
    const forma = normForma(r['FORMA DE PAGAMENTO'] ?? r.FORMA);
    const id = str(r.ID);
    const terc = ratById[id] ? sum(ratById[id], x => x.valor) : 0;
    const base = {id, desc: desc || '(sem descrição)', banco: banco || '(sem banco)', cat: cat || 'Sem categoria', forma, linha, tipo:'pontual'};
    const pm = parc.match(/^(\d+)\s*(?:\/|de)\s*(\d+)$/i);
    if (parc && !pm) issue('DESPESAS', linha, `Parcela "${parc}" fora do formato k/n (ex.: 2/6) em "${desc}" — tratada como compra à vista`);
    if (pm && +pm[1] >= 1 && +pm[1] <= +pm[2]){
      const k = +pm[1], n = +pm[2], g = 'g'+(uid++), cnt = n-k+1;
      if (terc > v*cnt) issue('DESPESAS', linha, `Rateio maior que a compra em "${desc}"`);
      for (let i = k; i <= n; i++){
        const dt = addMonths(d, i-k);
        M.despesas.push({...base, uid:'d'+(uid++), data:dt, ym:ymOf(dt), valor:v, parcela:i+'/'+n, parcI:i, parcN:n, grupo:g, terceiros: terc/cnt, tipo:'parcela'});
      }
    } else {
      if (pm) issue('DESPESAS', linha, `Parcela "${parc}" impossível em "${desc}"`);
      if (terc > v) issue('DESPESAS', linha, `Rateio (${fmt(terc)}) maior que a despesa (${fmt(v)}) em "${desc}"`);
      const k = iso(d)+'|'+nk(desc)+'|'+v;
      if (dupKey[k]) issue('DESPESAS', linha, `Possível duplicado: "${desc}" de ${fmt(v)} em ${fmtD(d)} (igual à linha ${dupKey[k]})`);
      dupKey[k] = linha;
      M.despesas.push({...base, uid:'d'+(uid++), data:d, ym:ymOf(d), valor:v, terceiros:terc});
    }
  });
  const ids = new Set(M.despesas.map(x => x.id).filter(Boolean));
  for (const [id, rs] of Object.entries(ratById)){
    if (!ids.has(id)) issue('RATEIOS', rs[0].linha, `Rateio com ID "${id}" não tem despesa correspondente na aba DESPESAS`);
    rs.forEach(r => M.rateios.push({...r, desp: M.despesas.find(x => x.id === id)}));
  }

  // RECORRENTES (bloco à direita na aba DESPESAS, ou aba própria)
  findBlock(S, ['DESPESAS','RECORRENTES'], ['DIA','VALOR']).forEach(r => {
    const desc = str(r.DESCRICAO || r.RECORRENTE || r.CONTA); const v = parseNum(r.VALOR); const dia = parseInt(r.DIA, 10);
    if (!desc && v == null) return;
    if (v == null || !(dia >= 1 && dia <= 31)){ issue('RECORRENTES', L(r), `Recorrente "${desc}" com valor ou dia do mês inválido`); return; }
    const ini = parseDate(r.INICIO), fim = parseDate(r.FIM);
    M.recorrentes.push({desc, cat: str(r.CATEGORIA) || 'Sem categoria', banco: str(r.BANCO) || '(sem banco)', valor:v, dia, forma: normForma(str(r['FORMA DE PAGAMENTO'] ?? r.FORMA) || 'Débito'), ini: ini ? ymOf(ini) : null, fim: fim ? ymOf(fim) : null, linha:L(r)});
  });

  // RECEITAS
  findBlock(S, ['RECEITAS'], ['DATA','VALOR']).forEach(r => {
    const desc = str(r.DESCRICAO); if (!desc && !str(r.DATA) && !str(r.VALOR)) return;
    const d = parseDate(r.DATA), v = parseNum(r.VALOR);
    if (!d){ issue('RECEITAS', L(r), `Data inválida "${str(r.DATA) || 'vazia'}" em "${desc}" — ficou fora dos cálculos`, 'err'); return; }
    if (v == null || v === 0){ issue('RECEITAS', L(r), `Valor zerado ou vazio em "${desc}" de ${fmtD(d)}`); if (v == null) return; }
    if (!str(r.BANCO)) issue('RECEITAS', L(r), `Receita sem banco: "${desc}" de ${fmtD(d)}`);
    const rc = nk(r.RECORRENCIA);
    M.receitas.push({desc: desc || '(sem descrição)', banco: str(r.BANCO) || '(sem banco)', valor:v, data:d, ym:ymOf(d), recorrente: !!rc && !['NAO','N','-'].includes(rc), linha:L(r)});
  });

  // TRANSFERÊNCIAS (não são gasto nem receita)
  findBlock(S, ['TRANSFERENCIAS'], ['BANCO ORIGEM','BANCO DESTINO','VALOR']).forEach(r => {
    const d = parseDate(r.DATA), v = parseNum(r.VALOR);
    if (!d && !v) return;
    if (!d || v == null){ issue('TRANSFERÊNCIAS', L(r), `Transferência com data ou valor inválido (${str(r.DATA)} · ${str(r.VALOR)})`, 'err'); return; }
    M.transf.push({data:d, ym:ymOf(d), origem:str(r['BANCO ORIGEM']), destino:str(r['BANCO DESTINO']), valor:v, obs:str(r.OBS || r.DESCRICAO)});
  });

  // INVESTIMENTOS: (a) total investido por ativo, (b) extrato de aportes/resgates, (c) saldo atual (snapshots)
  findBlock(S, ['INVESTIMENTOS'], ['ATIVO','VALOR INVESTIDO']).forEach(r => { const a = str(r.ATIVO), v = parseNum(r['VALOR INVESTIDO']); if (a && v != null) M.inv.tot.push({ativo:a, valor:v}); });
  findBlock(S, ['INVESTIMENTOS'], ['DATA','ATIVO','VALOR']).forEach(r => {
    const a = str(r.ATIVO), d = parseDate(r.DATA), v = parseNum(r.VALOR); if (!a) return;
    if (!d || v == null){ issue('INVESTIMENTOS', L(r), `Aporte/resgate de "${a}" com data ou valor inválido`); return; }
    M.inv.ext.push({ativo:a, data:d, valor:v, banco:str(r.BANCO)});
  });
  findBlock(S, ['INVESTIMENTOS'], ['ATIVO','SALDO ATUAL']).forEach(r => {
    const a = str(r.ATIVO), v = parseNum(r['SALDO ATUAL']); if (!a || v == null) return;
    M.inv.snap.push({ativo:a, valor:v, data: parseDate(r.DATA) || TODAY});
  });

  // ORÇAMENTOS: uma linha por categoria; coluna PADRÃO vale para todo mês; colunas de mês sobrescrevem
  findBlock(S, ['ORCAMENTOS'], ['CATEGORIA'], ['DATA','VALOR','PRODUTO','ITEM','DESCRICAO']).forEach(r => {
    const cat = str(r.CATEGORIA); if (!cat) return;
    for (const [k, val] of Object.entries(r)){
      if (k === 'CATEGORIA' || k === '_LINHA') continue;
      const v = parseNum(val); if (v == null) continue;
      if (['PADRAO','MENSAL','VALOR','ORCADO'].includes(k)) { M.orcPadrao[cat] = v; continue; }
      const ym = parseYmHeader(k); if (ym) (M.orc[ym] ||= {})[cat] = v;
    }
  });

  // CONFIG: saldo inicial por conta, ciclo dos cartões
  findBlock(S, ['CONFIG'], ['CONTA']).forEach(r => {
    const nome = str(r.CONTA); if (!nome) return; const t = nk(r.TIPO);
    M.config.push({nome, cartao: t.includes('CART') || t.includes('CRED'), saldoIni: parseNum(r['SALDO INICIAL']), ref: parseDate(r['DATA REFERENCIA']), fech: parseInt(r.FECHAMENTO,10) || null, venc: parseInt(r.VENCIMENTO,10) || null});
  });

  // SONHOS / METAS
  findBlock(S, ['SONHOS','METAS'], ['META']).forEach(r => {
    const nome = str(r.META); if (!nome) return;
    M.metas.push({nome, obj: parseNum(r['VALOR OBJETIVO']), guardado: parseNum(r['VALOR GUARDADO']), alvo: parseDate(r['DATA ALVO']), obs: str(r.OBSERVACAO)});
  });

  // MERCADO (itens das notas fiscais) e CATEGORIAS MERCADO (produto → categoria)
  M.mercado = []; M.mercCat = {};
  findBlock(S, ['CATEGORIAS MERCADO'], ['PRODUTO','CATEGORIA']).forEach(r => { const p = str(r.PRODUTO), c = str(r.CATEGORIA); if (p && c) M.mercCat[nk(p)] = c; });
  findBlock(S, ['MERCADO'], ['ITEM','VALOR TOTAL']).forEach(r => {
    const item = str(r.ITEM); if (!item) return;
    const d = parseDate(r.DATA), v = parseNum(r['VALOR TOTAL']);
    if (!d || v == null){ issue('MERCADO', L(r), `Item "${item}" sem data ou valor válido — ficou fora da aba Mercado`); return; }
    M.mercado.push({data:d, ym:ymOf(d), loja:str(r.LOJA) || '—', chave:str(r.CHAVE) || 'linha'+L(r), item, cod:str(r.CODIGO), qtd:parseNum(r.QTD) ?? 1, un:str(r.UN), unit:parseNum(r['VALOR UNIT']), total:v, catRow:str(r.CATEGORIA)});
  });

  // PAGAMENTOS (gravada pelo script de pagamentos)
  M.pagSheet = findBlock(S, ['PAGAMENTOS'], ['CHAVE']).map(r => ({CHAVE:str(r.CHAVE), TIPO:str(r.TIPO), REFERENCIA:str(r.REFERENCIA), VALOR:r.VALOR, BANCO:str(r.BANCO), DATA:str(r.DATA), STATUS:str(r.STATUS), OBS:str(r.OBS), 'DATA REGISTRO':str(r['DATA REGISTRO'])}));

  const datas = M.despesas.filter(x => x.tipo === 'pontual' || x.parcI === +String(x.parcela).split('/')[0]).map(x => x.data).concat(M.receitas.map(x => x.data)).filter(d => d <= TODAY);
  M.ini = datas.length ? ymOf(new Date(Math.min(...datas))) : CUR;
  return M;
}

// Marcações (pagamento de fatura, âncora de saldo, receita recebida): planilha + este navegador, a mais recente vence
function writes(){
  const out = {};
  const put = r => { const k = str(r.CHAVE); if (!k) return; const cur = out[k]; if (!cur || str(r['DATA REGISTRO']) >= str(cur['DATA REGISTRO'])) out[k] = r; };
  M.pagSheet.forEach(put); Object.values(state.local).forEach(put);
  return out;
}
const ativo = w => w && nk(w.STATUS) !== 'CANCELADO';
const orcamento = ym => ({...M.orcPadrao, ...(M.orc[ym] || {})});

function recExpand(ym){
  if (ym < M.ini) return [];
  const [y, m] = ym.split('-').map(Number);
  return M.recorrentes.filter(r => (!r.ini || r.ini <= ym) && (!r.fim || r.fim >= ym)).map((r, i) => {
    const d = mkDate(y, m-1, r.dia);
    return {uid:'r'+ym+i, desc:r.desc, cat:r.cat, banco:r.banco, forma:r.forma, valor:r.valor, data:d, ym, tipo:'recorrente', terceiros:0, linha:r.linha};
  });
}
// Gasto do mês (visão de consumo/orçamento): compra conta na data em que foi feita, inclusive no crédito
function gastos(ym){
  if (GC.has(ym)) return GC.get(ym);
  const out = M.despesas.filter(x => x.ym === ym).concat(recExpand(ym));
  GC.set(ym, out); return out;
}
function receitas(ym){
  if (RC.has(ym)) return RC.get(ym);
  const real = M.receitas.filter(x => x.ym === ym);
  const vir = Object.values(W).filter(w => nk(w.TIPO) === 'RECEBIDO' && ativo(w) && w.REFERENCIA === ym && !real.some(r => nk(r.desc) === nk(w.OBS)))
    .map(w => ({desc:w.OBS, banco:w.BANCO, valor:parseNum(w.VALOR) || 0, data:parseDate(w.DATA) || mkDate(+ym.slice(0,4), +ym.slice(5)-1, 1), ym, virtual:true, chave:w.CHAVE, recorrente:true}));
  const out = real.concat(vir); RC.set(ym, out); return out;
}
const gastoMes = ym => sum(gastos(ym), proprio);
const receitaMes = ym => sum(receitas(ym), x => x.valor);

// ---- cartões e faturas ----
function cartoes(){
  const map = {};
  M.config.filter(c => c.cartao).forEach(c => map[c.nome] = {nome:c.nome, fech:c.fech, venc:c.venc});
  M.despesas.concat(M.recorrentes).filter(x => x.forma === 'Crédito').forEach(x => map[x.banco] ||= {nome:x.banco, fech:null, venc:null});
  for (const [n, s] of Object.entries(state.settings.cartoes || {})){
    if (!map[n]) continue;
    for (const [k, v] of Object.entries(s)) if (v !== '' && v != null) map[n][k] = v;
  }
  return Object.values(map).map(c => ({...c, fech: +c.fech || null, venc: +c.venc || null, semCiclo: !(+c.fech && +c.venc)}));
}
// Fechamento do ciclo de um mês: data confirmada manualmente (lida do app do banco) tem prioridade sobre o dia aproximado
function fechamentoDe(c, ym){
  for (const k of ['fechConf','fechAnt']){ const d = c[k] && parseDate(c[k]); if (d && ymOf(d) === ym) return d; }
  const [y, m] = ym.split('-').map(Number);
  return mkDate(y, m-1, c.fech || 1);
}
const vencimentoDe = (c, f) => { const v = c.venc || 10; return mkDate(f.getFullYear(), f.getMonth() + (v > f.getDate() ? 0 : 1), v); };
function faturaDaCompra(c, d){ let ym = ymOf(d), f = fechamentoDe(c, ym); if (d >= f){ ym = ymAdd(ym, 1); f = fechamentoDe(c, ym); } return f; }
function creditItems(nome){
  const rec = ymRange(M.ini, ymAdd(CUR, 1)).flatMap(recExpand).filter(x => x.forma === 'Crédito' && x.banco === nome);
  return M.despesas.filter(x => x.forma === 'Crédito' && x.banco === nome).concat(rec);
}
function faturas(c){
  const g = {};
  creditItems(c.nome).forEach(x => {
    const f = faturaDaCompra(c, x.data), k = iso(f);
    (g[k] ||= {cartao:c.nome, fechamento:f, vencimento:vencimentoDe(c, f), itens:[]}).itens.push(x);
  });
  return Object.values(g).map(fa => {
    fa.total = sum(fa.itens, x => x.valor);  // fatura = o que o banco cobra: valor cheio, inclusive a parte de terceiros
    fa.chave = c.nome+'_'+iso(fa.vencimento);
    const w = W[fa.chave]; fa.paga = ativo(w) && nk(w.TIPO) === 'FATURA' ? w : null;
    fa.status = fa.paga ? 'paga' : fa.fechamento > TODAY ? 'aberta' : fa.vencimento < TODAY ? 'vencida' : 'fechada';
    return fa;
  }).sort((a,b) => a.fechamento - b.fechamento);
}

// ---- contas e saldo ----
function contas(){
  const map = {};
  M.config.filter(c => !c.cartao).forEach(c => map[c.nome] = {nome:c.nome, saldoIni:c.saldoIni, ref:c.ref, fonte:'aba CONFIG'});
  for (const [nome, s] of Object.entries(state.settings.contas || {})){
    const v = parseNum(s.saldoIni), r = parseDate(s.ref);
    if (v != null && r) map[nome] = {nome, saldoIni:v, ref:r, fonte:'Configurações deste navegador'};
    else map[nome] ||= {nome, saldoIni:null, ref:null};
  }
  // "Reancorar": o saldo real conferido com o banco vira o novo ponto de partida
  Object.values(W).filter(w => nk(w.TIPO) === 'ANCORA' && ativo(w)).forEach(w => {
    const ref = parseDate(w.DATA), v = parseNum(w.VALOR), c = map[w.BANCO];
    if (!ref || v == null) return;
    if (!c || !c.ref || ref >= c.ref) map[w.BANCO] = {nome:w.BANCO, saldoIni:v, ref, fonte:'conferência com o banco'};
  });
  return Object.values(map).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
}
// Saldo estimado = saldo inicial + eventos de CAIXA depois da data de referência.
// Compras no crédito nunca entram aqui: só o pagamento da fatura sai da conta.
function eventosConta(c){
  if (c.saldoIni == null || !c.ref) return null;
  const ev = [], inR = d => d > c.ref && d <= TODAY;
  M.despesas.forEach(x => { if (x.forma !== 'Crédito' && x.banco === c.nome && inR(x.data)) ev.push({data:x.data, desc:x.desc, valor:-x.valor, tipo:x.forma}); });
  ymRange(ymOf(c.ref), CUR).flatMap(recExpand).forEach(x => { if (x.forma !== 'Crédito' && x.banco === c.nome && inR(x.data)) ev.push({data:x.data, desc:x.desc, valor:-x.valor, tipo:'Recorrente'}); });
  ymRange(ymOf(c.ref), CUR).flatMap(receitas).forEach(x => { if (x.banco === c.nome && inR(x.data)) ev.push({data:x.data, desc:x.desc, valor:x.valor, tipo:x.virtual ? 'Receita (marcada)' : 'Receita'}); });
  M.transf.forEach(t => {
    if (!inR(t.data)) return;
    if (t.origem === c.nome) ev.push({data:t.data, desc:'Transferência para '+t.destino, valor:-t.valor, tipo:'Transferência'});
    if (t.destino === c.nome) ev.push({data:t.data, desc:'Transferência de '+t.origem, valor:t.valor, tipo:'Transferência'});
  });
  Object.values(W).forEach(w => {
    if (nk(w.TIPO) !== 'FATURA' || !ativo(w) || w.BANCO !== c.nome) return;
    const d = parseDate(w.DATA) || parseDate(str(w['DATA REGISTRO']).slice(0,10)); const v = parseNum(w.VALOR);
    if (d && v != null && inR(d)) ev.push({data:d, desc:'Fatura '+(w.REFERENCIA || w.CHAVE), valor:-v, tipo:'Fatura paga'});
  });
  M.inv.ext.forEach(x => { if (x.banco === c.nome && inR(x.data)) ev.push({data:x.data, desc:(x.valor >= 0 ? 'Aporte · ' : 'Resgate · ')+x.ativo, valor:-x.valor, tipo:'Investimento'}); });
  ev.sort((a,b) => a.data - b.data);
  let s = c.saldoIni; ev.forEach(e => { s += e.valor; e.saldo = s; });
  return {saldo:s, ev};
}

function computeCtx(){
  W = writes(); GC = new Map(); RC = new Map();
  CARDS = cartoes(); FATS = CARDS.flatMap(faturas);
  CONTAS = contas().map(c => ({...c, calc: eventosConta(c)}));
}

// ---- investimentos ----
function investimentos(){
  const nomes = uniq([...M.inv.tot.map(x => x.ativo), ...M.inv.ext.map(x => x.ativo), ...M.inv.snap.map(x => x.ativo)]);
  return nomes.map(a => {
    const t = M.inv.tot.find(x => x.ativo === a), ext = M.inv.ext.filter(x => x.ativo === a);
    const investido = t ? t.valor : sum(ext, x => x.valor);
    const snaps = M.inv.snap.filter(x => x.ativo === a).sort((p,q) => p.data - q.data);
    const last = snaps.at(-1);
    const atual = last ? last.valor : investido;
    return {ativo:a, investido, atual, data:last?.data, rend:atual-investido, snaps, ext};
  }).sort((p,q) => q.atual - p.atual);
}

// ---- receitas recorrentes conhecidas ----
function recorrentesReceita(){
  const g = {};
  M.receitas.filter(r => r.recorrente).forEach(r => { const k = nk(r.desc); (g[k] ||= []).push(r); });
  return Object.values(g).map(list => {
    list.sort((a,b) => a.data - b.data); const last = list.at(-1);
    const dias = list.map(x => x.data.getDate()).sort((a,b) => a-b);
    return {desc:last.desc, valor:last.valor, banco:last.banco, dia:dias[Math.floor(dias.length/2)], meses:new Set(list.map(x => x.ym))};
  }).sort((a,b) => b.valor - a.valor);
}

// ---- alertas por regra (sempre explicando o número) ----
function alertas(ym){
  const out = [];
  const lim = ym === CUR ? TODAY.getDate() : 31;
  const g = gastos(ym), byCat = groupSum(g, x => x.cat, proprio), orc = orcamento(ym);
  for (const [cat, b] of Object.entries(orc)){
    if (!(b > 0)) continue; const v = byCat[cat] || 0;
    if (v > b) out.push({tone:'red', t:`${cat} passou do orçamento`, d:`${fmt(v)} gastos de ${fmt(b)} orçados — ${fmt(v-b)} acima (+${pct(v/b-1)}).`});
    else if (v >= .85*b) out.push({tone:'amber', t:`${cat} perto do limite`, d:`${pct(v/b)} do orçamento usado (${fmt(v)} de ${fmt(b)}); restam ${fmt(b-v)}.`});
  }
  // variação relevante (>10%) contra o mês anterior, comparando o mesmo trecho do mês
  const prevYm = ymAdd(ym, -1);
  if (prevYm >= M.ini){
    const prev = groupSum(gastos(prevYm).filter(x => x.data.getDate() <= lim), x => x.cat, proprio);
    const now = groupSum(g.filter(x => x.data.getDate() <= lim), x => x.cat, proprio);
    Object.keys({...prev, ...now}).map(c => ({c, a:prev[c]||0, b:now[c]||0}))
      .filter(o => o.a >= 200 && Math.abs(o.b-o.a) >= 150 && Math.abs(o.b/o.a-1) > .10)
      .sort((p,q) => Math.abs(q.b-q.a) - Math.abs(p.b-p.a)).slice(0,3)
      .forEach(o => out.push({tone: o.b > o.a ? 'amber' : 'green', t:`${o.c}: ${o.b > o.a ? 'alta' : 'queda'} de ${pct(Math.abs(o.b/o.a-1))} contra ${ymLabel(prevYm)}`,
        d:`${fmt(o.b)} ${ym === CUR ? 'até o dia '+lim : 'no mês'} contra ${fmt(o.a)} no mesmo período de ${ymLabel(prevYm, true)}.`}));
  }
  const rec = receitaMes(ym);
  if (ym < CUR && rec > 0){
    const taxa = (rec - gastoMes(ym)) / rec, meta = (+state.settings.metaPoupanca || 0)/100;
    if (meta && taxa < meta) out.push({tone:'amber', t:'Poupança abaixo da meta', d:`Sobrou ${pct(taxa)} da receita em ${ymLabel(ym, true)} (${fmt(rec - gastoMes(ym))}); a meta é ${pct(meta)}.`});
  }
  const fontes = groupSum(receitas(ym), x => x.desc, x => x.valor);
  const top = Object.entries(fontes).sort((a,b) => b[1]-a[1])[0];
  if (top && rec > 0 && top[1]/rec > .8 && Object.keys(fontes).length > 0) out.push({tone:'blue', t:'Receita concentrada numa fonte', d:`${top[0]} responde por ${pct(top[1]/rec)} da receita de ${ymLabel(ym, true)}.`});
  recorrentesReceita().forEach(r => {
    const prev3 = [1,2,3].map(n => ymAdd(ym, -n));
    if (!prev3.every(m => r.meses.has(m))) return;
    if (receitas(ym).some(x => nk(x.desc) === nk(r.desc))) return;
    if (ym === CUR && TODAY.getDate() <= r.dia + 2) return;
    out.push({tone:'amber', t:`${r.desc} não apareceu em ${ymLabel(ym, true)}`, d:`Costuma cair por volta do dia ${r.dia} (${fmt(r.valor)}, ${r.banco}) e esteve presente nos últimos 3 meses.`,
      act:`<button class="btn sm" data-act="receber" data-desc="${esc(r.desc)}" data-ym="${ym}" data-valor="${r.valor}" data-banco="${esc(r.banco)}" data-dia="${r.dia}">Marcar como recebido</button>`});
  });
  return out;
}

function openXp(k){
  const e = XP[k]; if (!e) return;
  const comUnit = e.items.some(x => x.unit != null);
  // histórico de um único produto: em ordem de data (mais recente primeiro), para ver a evolução do preço

function sparkSvg(vals){
  vals = vals.filter(v => isFinite(v)); if (vals.length < 2) return '';
  const w = 120, h = 28, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v,i) => `${(i/(vals.length-1)*w).toFixed(1)},${(h-3-(v-mn)/r*(h-6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
function kpi({label, value, sub='', x='', spark=null, tone=''}){
  return `<div class="kpi ${x ? 'click' : ''}" ${x}><div class="kpi-l"><span>${label}</span>${x ? '<span class="why">por quê?</span>' : ''}</div><div class="kpi-v ${tone}">${value}</div>${sub ? `<div class="kpi-s">${sub}</div>` : ''}${spark ? sparkSvg(spark) : ''}</div>`;
}

}

const pMonths = () => { const p = state.period; if (p.mode === 'range'){ const a = p.from <= p.to ? p.from : p.to, b = p.from <= p.to ? p.to : p.from; return ymRange(a, b); } return [p.ym]; };

const pEnd = () => pMonths().at(-1);

// Quanto saiu de fato das contas no período (débito/PIX/boleto + faturas pagas) — diferente do "gasto do mês"
function saidaCaixa(ms){
  const set = new Set(ms);
  const itens = ms.flatMap(gastos).filter(x => x.forma !== 'Crédito').map(x => ({data:x.data, desc:x.desc, sub:x.banco+' · '+x.forma, valor:x.valor}));
  Object.values(W).forEach(w => { if (nk(w.TIPO) !== 'FATURA' || !ativo(w)) return; const d = parseDate(w.DATA); if (d && set.has(ymOf(d)) && d <= TODAY) itens.push({data:d, desc:'Fatura '+w.REFERENCIA, sub:'paga por '+w.BANCO, valor:parseNum(w.VALOR) || 0}); });
  return {total:sum(itens, x => x.valor), itens: itens.filter(x => x.data <= TODAY)};
}

  const pend = pendencias(), al = alertas(ref);

  if (single && ms[0] === CUR){
    const g = gastos(CUR), dia = TODAY.getDate(), dm = lastDay(TODAY.getFullYear(), TODAY.getMonth());
    const variaveis = g.filter(x => x.tipo === 'pontual' && x.data <= TODAY), fixos = g.filter(x => x.tipo !== 'pontual'), futuros = g.filter(x => x.tipo === 'pontual' && x.data > TODAY);

  const prox = proximas();
  const rat = M.rateios.filter(r => !r.recebido);

  const issues = M.issues.filter(i => !state.dismissed.includes(i.id));

      <div class="big" ${xRes}>${fmt(res)}</div>

    <div class="hero-r">

    </div>
  </section>
  ${pend.length || al.length ? alertList(pend.concat(al)) : '<div class="note">Nenhuma pendência nem alerta para o período.</div>'}
  <div class="kpis">
    ${kpi({label:'Receitas', value:fmt(rec), x:xp('Receitas · '+pLabel(), Rc.map(xpRec)), spark:sm.map(receitaMes), sub:sm.length > 1 ? 'últimos '+sm.length+' meses' : ''})}
    ${kpi({label:'Despesas', value:fmt(gasto), x:xp('Despesas · '+pLabel(), G.map(xpGasto), 'compras no crédito contam na data da compra'), spark:sm.map(gastoMes),
      sub:`<span ${xp('Saiu de fato das contas · '+pLabel(), saiu.itens, 'débito, PIX, boleto e faturas pagas')}>saiu de fato das contas: ${fmt(saiu.total)}</span>`})}
    ${kpi({label:'Poupança', value:pct(taxa), tone: isFinite(taxa) && taxa < meta ? 'warn' : '', sub:`${fmt(res)} · meta ${pct(meta)}`, spark:sm.map(m => { const r = receitaMes(m); return r > 0 ? (r - gastoMes(m))/r : NaN; })})}
    ${kpi({label:'Faturas a pagar', value:fmt(sum(fPend, f => f.total)), x:xp('Faturas fechadas e não pagas', fPend.map(f => ({data:f.vencimento, desc:'Fatura '+f.cartao, sub:'fechou '+fmtD(f.fechamento)+' · vence '+fmtD(f.vencimento), valor:f.total}))),
      sub:`em formação: <span ${xp('Faturas em formação', fAb.map(f => ({data:f.fechamento, desc:'Fatura '+f.cartao, sub:'fecha '+fmtD(f.fechamento), valor:f.total})))}>${fmt(sum(fAb, f => f.total))}</span>`, spark:sm.map(fatVenc)})}
  </div>
  ${proj}
  <div class="grid2">
    <div class="card"><h2>Orçamento ${single ? 'do mês' : 'do período'} <span class="r"><a href="#" data-nav="orcamento">detalhes</a></span></h2>

      <div class="stack" style="margin-top:18px">${topCats.map(o => `<div><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(o.c)}</span><span class="muted">${fmt(o.g)}${o.o ? ' / '+fmtK(o.o) : ' · sem orçamento'}</span></div>${o.o ? bar(o.g/o.o, o.g > o.o ? 'over' : o.g > .85*o.o ? 'near' : '') : ''}</div>`).join('')}</div>`
      : '<div class="empty">Nenhum orçamento definido. Preencha a aba ORÇAMENTOS.</div>'}
    </div>
    <div class="card"><h2>Tendência — receitas x despesas <span class="r">12 meses</span></h2>${noChart()}<div class="chart"><canvas id="ch-trend"></canvas></div></div>
  </div>
  ${det('vg-prox', 'Próximas contas', prox.html, {meta: prox.n ? prox.n+' nos próximos 15 dias · '+fmt(prox.total) : 'nada nos próximos 15 dias'})}
  ${det('vg-fat', 'Faturas por cartão', faturasResumo(), {meta: CARDS.length+' cartões'})}
  ${det('vg-pat', 'Patrimônio', `<div class="kv" style="max-width:420px">
      ${comSaldo.map(c => `<span>${esc(c.nome)} (conta)</span><span>${fmt(c.calc.saldo)}</span>`).join('')}

  ${rat.length ? det('vg-rat', 'A receber de rateios', `<table class="t"><thead><tr><th>De quem</th><th>Despesa</th><th class="num">Valor</th></tr></thead><tbody>${rat.map(r => `<tr><td>${esc(r.deQuem)}</td><td>${r.desp ? esc(r.desp.desc)+' <span class="muted small">'+fmtD(r.desp.data)+'</span>' : '<span class="muted">ID '+esc(r.id)+'</span>'}</td><td class="num">${fmt(r.valor)}</td></tr>`).join('')}</tbody></table><p class="note">A parte de terceiros não entra no seu gasto nem no orçamento, mas entra cheia na fatura do cartão. Preencha a coluna RECEBIDO na aba RATEIOS quando acertarem.</p>`, {meta: fmt(sum(rat, r => r.valor))}) : ''}
  ${det('vg-rev', 'Revisão de lançamentos', revisao(issues), {meta: issues.length ? issues.length+' aviso'+(issues.length > 1 ? 's' : '') : 'tudo certo'})}

  ]}, options:{scales:{y:moneyAxis, x:{grid:{display:false}}}, plugins:{legend:{position:'bottom'}}, interaction:{mode:'index', intersect:false}}}));

function proximas(){
  const fim = addDays(TODAY, 15), list = [];
  [CUR, ymAdd(CUR,1)].flatMap(recExpand).forEach(x => { if (x.data >= TODAY && x.data <= fim && x.forma !== 'Crédito') list.push({data:x.data, desc:x.desc, sub:x.banco+' · '+x.forma+' · recorrente', valor:x.valor}); });
  M.despesas.forEach(x => { if (x.tipo === 'pontual' && x.forma !== 'Crédito' && x.data > TODAY && x.data <= fim) list.push({data:x.data, desc:x.desc, sub:x.banco+' · '+x.forma, valor:x.valor}); });
  FATS.forEach(f => { if (f.status !== 'paga' && f.vencimento >= TODAY && f.vencimento <= fim) list.push({data:f.vencimento, desc:'Fatura '+f.cartao, sub:f.status === 'aberta' ? 'ainda em formação' : 'fechada', valor:f.total}); });
  list.sort((a,b) => a.data - b.data);
  return {n:list.length, total:sum(list, x => x.valor), html: list.length ? `<table class="t"><thead><tr><th>Vence</th><th>Conta</th><th class="num">Valor</th></tr></thead><tbody>${list.map(x => `<tr><td>${fmtDs(x.data)}</td><td>${esc(x.desc)}<div class="small muted">${esc(x.sub)}</div></td><td class="num">${fmt(x.valor)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Nada vence nos próximos 15 dias.</div>'};
}
function faturasResumo(){
  if (!CARDS.length) return '<div class="empty">Nenhum cartão encontrado.</div>';
  return `<table class="t"><thead><tr><th>Cartão</th><th>Fatura fechada</th><th class="num">Valor</th><th>Em formação</th><th class="num">Até agora</th></tr></thead><tbody>${CARDS.map(c => {
    const fs = FATS.filter(f => f.cartao === c.nome), fe = fs.filter(f => f.fechamento <= TODAY).at(-1), ab = fs.find(f => f.status === 'aberta');
    return `<tr><td><a href="#" data-act="verCartao" data-cartao="${esc(c.nome)}">${esc(c.nome)}</a></td><td>${fe ? 'vence '+fmtDs(fe.vencimento)+' '+badgeStatus(fe.status) : '—'}</td><td class="num">${fe ? fmt(fe.total) : '—'}</td><td>${ab ? 'fecha '+fmtDs(ab.fechamento) : '—'}</td><td class="num">${ab ? fmt(ab.total) : '—'}</td></tr>`;
  }).join('')}</tbody></table>`;
}
function revisao(issues){
  const nDis = M.issues.length - issues.length;
  return (issues.length ? `<div class="stack">${issues.map(i => `<div class="alert ${i.sev === 'err' ? 'red' : 'amber'}"><div><div class="tt" style="font-weight:500">${esc(i.msg)}</div><div class="dd small">aba ${esc(i.aba)}${i.linha !== '?' ? ', linha '+i.linha : ''}</div></div><div class="act"><button class="btn sm" data-act="dismiss" data-id="${esc(i.id)}">Está certo, não avisar mais</button></div></div>`).join('')}</div>` : '<div class="empty">Nenhum lançamento suspeito encontrado.</div>')
    + (nDis ? `<p class="note">${nDis} aviso${nDis > 1 ? 's' : ''} silenciado${nDis > 1 ? 's' : ''}. <button class="btn link sm" data-act="undismiss">mostrar de novo</button></p>` : '')
    + '<p class="note">A revisão procura datas impossíveis, valores zerados ou ilegíveis, categorias e bancos vazios, parcelas mal formatadas, rateios sem despesa e possíveis duplicados. Silenciar não altera a planilha.</p>';
}

// ---------------- Ano ----------------
function renderAno(root){
  const y = state.ano ?? +refMonth().slice(0,4);
  const months = Array.from({length:12}, (_,i) => y+'-'+pad(i+1));
  const done = months.filter(m => m <= CUR && m >= M.ini);
  const rows = months.map(m => ({m, ok: done.includes(m), rec: done.includes(m) ? receitaMes(m) : 0, gas: done.includes(m) ? gastoMes(m) : 0}));
  const rec = sum(rows, r => r.rec), gas = sum(rows, r => r.gas), res = rec - gas;
  const mx = Math.max(1, ...rows.map(r => Math.max(r.rec, r.gas)));
  const G = done.flatMap(gastos), cats = Object.entries(groupSum(G, x => x.cat, proprio)).sort((a,b) => b[1]-a[1]).map(e => e[0]);
  const heat = {}; done.forEach(m => heat[m] = groupSum(gastos(m), x => x.cat, proprio));
  root.innerHTML = `
  ${pageHead('Ano de '+y, done.length ? `${done.length} ${done.length === 1 ? 'mês' : 'meses'} com dados` : 'sem dados neste ano', `<div class="foot-row"><button class="btn sm" data-act="ano" data-d="-1" aria-label="Ano anterior">${ico('left')}</button><button class="btn sm" data-act="ano" data-d="1" aria-label="Próximo ano">${ico('right')}</button></div>`)}
  <div class="kpis k5">
    ${kpi({label:'Receitas no ano', value:fmtK(rec), x:xp('Receitas de '+y, done.flatMap(receitas).map(xpRec))})}
    ${kpi({label:'Despesas no ano', value:fmtK(gas), x:xp('Despesas de '+y, G.map(xpGasto))})}
    ${kpi({label:'Resultado', value:fmtK(res), tone:tone(res)})}
    ${kpi({label:'Poupança', value:pct(rec > 0 ? res/rec : NaN), sub:'meta '+pct((+state.settings.metaPoupanca||0)/100)})}
    ${kpi({label:'Gasto médio por mês', value:fmtK(done.length ? gas/done.length : 0), sub:'só meses até hoje'})}
  </div>
  <div class="card"><h2>Mês a mês</h2><div class="tbl-wrap free"><table class="t"><thead><tr><th>Mês</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="hide-sm" style="width:34%"></th><th class="num">Resultado</th><th class="num hide-sm">Poupança</th></tr></thead><tbody>
    ${rows.map(r => r.ok ? `<tr><td><a href="#" data-act="irMes" data-ym="${r.m}">${ymLabel(r.m, true)}</a></td><td class="num">${fmt(r.rec)}</td><td class="num">${fmt(r.gas)}</td>
      <td class="hide-sm"><div class="stack" style="gap:3px"><div class="hbar"><i style="width:${r.rec/mx*100}%;background:var(--green)"></i></div><div class="hbar"><i style="width:${r.gas/mx*100}%;background:var(--accent)"></i></div></div></td>
      <td class="num ${tone(r.rec-r.gas)}">${fmt(r.rec-r.gas)}</td><td class="num hide-sm muted">${r.rec > 0 ? pct((r.rec-r.gas)/r.rec) : '—'}</td></tr>`
      : `<tr class="muted"><td>${ymLabel(r.m, true)}</td><td class="num">—</td><td class="num">—</td><td class="hide-sm"></td><td class="num">—</td><td class="num hide-sm">—</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="num">${fmt(rec)}</td><td class="num">${fmt(gas)}</td><td class="hide-sm"></td><td class="num ${tone(res)}">${fmt(res)}</td><td class="num hide-sm">${rec > 0 ? pct(res/rec) : '—'}</td></tr></tfoot></table></div></div>
  <div class="card"><h2>Mapa de calor — gasto por categoria <span class="r">cor relativa ao maior mês de cada categoria</span></h2>
    ${cats.length ? `<div class="tbl-wrap free"><table class="t heat"><thead><tr><th>Categoria</th>${months.map(m => `<th class="num">${MESES[+m.slice(5)-1]}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>
      ${cats.map(c => { const vals = months.map(m => heat[m]?.[c] || 0), rmx = Math.max(...vals) || 1; return `<tr><td>${esc(c)}</td>${months.map((m,i) => heat[m] ? `<td style="background:color-mix(in srgb, var(--accent) ${Math.round(vals[i]/rmx*55)}%, transparent)" title="${esc(c)} · ${ymLabel(m)}: ${fmt(vals[i])}">${vals[i] ? fmtK(vals[i]).replace('R$ ','') : '·'}</td>` : '<td class="muted">—</td>').join('')}<td class="num" style="font-weight:600">${fmtK(sum(vals))}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<div class="empty">Sem despesas neste ano.</div>'}
  </div>`;
}

// ---------------- Despesas ----------------
const DTABS = [['dia','Dia a dia'],['rec','Recorrentes'],['parc','Parcelamentos'],['fat','Faturas'],['cons','Visão consolidada'],['top','Maiores gastos']];
function aplicaF(items, skip){ const F = state.F; return items.filter(x => (skip === 'cat' || !F.cat || x.cat === F.cat) && (!F.banco || x.banco === F.banco) && (!F.forma || x.forma === F.forma) && (!F.q || nk(x.desc).includes(nk(F.q)))); }
function filtros(items){
  const F = state.F, sel = (k, label, opts) => `<select data-f="${k}" aria-label="${label}"><option value="">${label}</option>${opts.map(o => `<option ${o === F[k] ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  const chips = ['cat','banco','forma'].filter(k => F[k]).map(k => `<span class="chip">${esc(F[k])}<button data-act="clearF" data-k="${k}" aria-label="Remover filtro">${ico('x')}</button></span>`).join('') + (F.q ? `<span class="chip">“${esc(F.q)}”<button data-act="clearF" data-k="q" aria-label="Limpar busca">${ico('x')}</button></span>` : '');
  return `<div class="filters"><input type="search" data-f="q" placeholder="Buscar descrição…" value="${esc(F.q)}">${sel('cat','Todas as categorias', uniq(items.map(x => x.cat)))}${sel('banco','Todos os bancos', uniq(items.map(x => x.banco)))}${sel('forma','Todas as formas', uniq(items.map(x => x.forma)))}</div>${chips ? `<div class="chips" style="margin-top:10px">${chips}</div>` : ''}`;
}
function linhasDesp(items, {limit} = {}){
  if (!items.length) return '<div class="empty">Nenhum lançamento com esses filtros.</div>';
  const list = [...items].sort((a,b) => b.data - a.data);
  const shown = limit ? list.slice(0, limit) : list;
  return `<div class="tbl-wrap"><table class="t"><thead><tr><th>Data</th><th>Descrição</th><th class="hide-sm">Categoria</th><th class="hide-sm">Banco · forma</th><th class="num">Valor</th></tr></thead><tbody>${shown.map(x => `
    <tr><td class="muted">${fmtDs(x.data)}</td><td>${esc(x.desc)}${x.parcela ? `<span class="badge">${x.parcela}</span>` : ''}${x.tipo === 'recorrente' ? '<span class="badge">recorrente</span>' : ''}${x.terceiros ? `<span class="badge blue">rateio</span>` : ''}<div class="small muted" style="display:none" data-sm>${esc(x.cat)}</div></td>
    <td class="hide-sm"><a href="#" data-act="setF" data-k="cat" data-v="${esc(x.cat)}" style="color:inherit">${esc(x.cat)}</a></td><td class="hide-sm muted">${esc(x.banco)} · ${esc(x.forma)}</td>
    <td class="num">${fmt(proprio(x))}${x.terceiros ? `<div class="small muted">total ${fmt(x.valor)}</div>` : ''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td></td><td>${items.length} lançamentos</td><td class="hide-sm"></td><td class="hide-sm"></td><td class="num">${fmt(sum(items, proprio))}</td></tr></tfoot></table></div>${limit && list.length > limit ? `<p class="note">Mostrando ${limit} de ${list.length}.</p>` : ''}`;
}
function renderDespesas(root){
  const ms = pMonths(), t = state.despTab;
  const body = {dia:tabDia, rec:tabRec, parc:tabParc, fat:tabFat, cons:tabCons, top:tabTop}[t] || tabDia;
  root.innerHTML = `${pageHead('Despesas', t === 'rec' || t === 'parc' || t === 'fat' ? 'independe do período' : pLabel())}
    <div class="tabs" role="tablist">${DTABS.map(([k,l]) => `<button role="tab" class="${k === t ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')}</div>
    ${body(ms)}`;
}
function tabDia(ms){
  const all = ms.flatMap(m => M.despesas.filter(x => x.ym === m));
  const items = aplicaF(all), forChart = aplicaF(all, 'cat');
  const byCat = Object.entries(groupSum(forChart, x => x.cat, proprio)).sort((a,b) => b[1]-a[1]);
  chart('ch-dia', () => ({type:'bar', data:{labels:byCat.map(e => e[0]), datasets:[{data:byCat.map(e => e[1]), backgroundColor:byCat.map(e => state.F.cat && e[0] !== state.F.cat ? css('--surface-2') : css('--primary')), borderRadius:4}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' '+fmt(c.parsed.x)}}}, scales:{x:moneyAxis, y:{grid:{display:false}}}, onClick:(e, els, ch) => { if (!els.length) return; const c = ch.data.labels[els[0].index]; state.F.cat = state.F.cat === c ? '' : c; render(); }, onHover:(e, els) => e.native.target.style.cursor = els.length ? 'pointer' : 'default'}}));
  return `<div class="card">${filtros(all)}</div>
    <div class="grid2 dia">
      <div class="card"><h2>Por categoria <span class="r">clique para filtrar</span></h2>${noChart()}<div class="chart" style="height:${Math.max(200, byCat.length*30+40)}px"><canvas id="ch-dia"></canvas></div></div>
      <div class="card"><h2>Lançamentos <span class="r">${fmt(sum(items, proprio))}</span></h2>${linhasDesp(items)}</div>
    </div><p class="note">Compras no crédito aparecem na data da compra. Valores com rateio mostram só a sua parte; o total cobrado aparece embaixo. Recorrentes ficam na aba própria.</p>`;

function tabRec(){
  const ym = refMonth(), its = recExpand(ym);
  const tot = sum(M.recorrentes, r => r.valor);

function conferirFatura(txt, f){
  const linhas = txt.split(/\n/).map(l => l.trim()).filter(Boolean);
  const banco = [];
  for (const l of linhas){
    if (/total|pagamento (recebido|efetuado)|saldo anterior|limite/i.test(l)) continue;
    const ms = [...l.matchAll(/(-|−)?\s*(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})/g)]; if (!ms.length) continue;
    const m = ms.at(-1); const v = parseNum(m[2]) * (m[1] ? -1 : 1);
    const desc = l.replace(m[0], '').replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?\b/g, '').replace(/\s+/g, ' ').trim() || '(sem descrição)';
    banco.push({desc, valor:v});
  }
  const painel = f.itens.map(x => ({desc:x.desc+(x.parcela ? ' '+x.parcela : ''), valor:x.valor, usado:false}));
  const ok = [], soBanco = [];
  banco.forEach(b => { const p = painel.find(p => !p.usado && Math.abs(p.valor - b.valor) < 0.011); if (p){ p.usado = true; ok.push(b); } else soBanco.push(b); });
  return {txt, ok, soBanco, soPainel: painel.filter(p => !p.usado), totBanco: sum(banco, x => x.valor), totPainel: f.total};
}

      <p style="margin:12px 0 0">${d > .1 ? `<b class="neg">Gastando rápido demais:</b> já foi ${pct(cons)} do orçamento com ${pct(frac)} do mês. No ritmo atual, o mês fecha perto de ${fmt(tG/frac)}.` : d > 0 ? `<b class="warn">Um pouco acima do ritmo</b> — ${pct(cons)} do orçamento usado com ${pct(frac)} do mês.` : `<b class="pos">Dentro do ritmo:</b> ${pct(cons)} do orçamento usado com ${pct(frac)} do mês.`}</p>

    ${cats.map(c => { const g = byCat[c] || 0, o = orc[c], p = g/o; return `<tr><td>${esc(c)}</td><td class="num muted">${fmt(o)}</td><td class="num" style="cursor:pointer" ${xp(c+' · '+pLabel(), G.filter(x => x.cat === c).map(xpGasto))}>${fmt(g)}</td><td class="hide-sm" style="vertical-align:middle">${bar(p, p > 1 ? 'over' : p > .85 ? 'near' : '', isCur ? frac : null)}</td><td class="num ${o - g < 0 ? 'neg' : ''}">${fmt(o - g)}<div class="small muted">${pct(p)}</div></td></tr>`; }).join('')}
  </tbody></table></div>${isCur ? '<p class="note">O traço vertical em cada barra marca quanto do mês já passou.</p>' : ''}` : '<div class="empty">Nenhum orçamento para o período. Preencha a aba ORÇAMENTOS (coluna PADRÃO para todo mês, ou colunas de mês como 11/2026).</div>'}</div>
  ${det('orc-hist', 'Evolução orçado × gasto', noChart()+'<div class="chart"><canvas id="ch-orc"></canvas></div>', {meta:'12 meses'})}`;
}

// =====================================================================
//  Mercado — itens das notas fiscais (NFC-e) do supermercado
//  As notas DETALHAM o que já está em Despesas (categoria Mercado);
//  nunca entram de novo no total de gastos.
// =====================================================================
const MCATS = ['Hortifruti','Carnes e peixes','Frios e laticínios','Padaria','Mercearia','Bebidas','Limpeza','Higiene','Congelados','Doces e snacks','Pet','Bebê','Utilidades','Outros'];
// palavras-chave (prefixos) para sugerir a categoria; a ordem importa: a primeira que casar vence
const MKEYS = [

  ['Bebê', 'FRALDA|LENCO UMED|PAPINHA|MAMADEIRA|POMADA ASSAD'],
  ['Utilidades', 'PILHA|LAMPADA|VELA\\b|FOSFORO|PAPEL ALUM|PAPEL FILME|GUARDANAPO|COPO DESC|PRATO DESC|CARVAO|ISQUEIRO|SACOLA'],
  ['Limpeza', 'DETERG|SABAO|LAVA ROUP|AMACIANTE|DESINF|AGUA SANIT|ALVEJ|ESPONJA|LIMP|MULTIUSO|VEJA\\b|PAPEL TOALHA|PAP TOALHA|SACO (P |PARA )?LIXO|LUSTRA|INSETIC|PANO\\b|LA DE ACO|BOMBRIL|PINHO'],
  ['Higiene', 'SHAMPOO|SH\\b|CONDICION|COND\\b|SABONETE|SAB LIQ|CREME DENT|CR DENT|PASTA DENT|ESCOVA DENT|FIO DENT|DESOD|PAPEL HIG|PAP HIG|ABSORV|BARBEAR|COTONETE|ALGODAO|ENXAG|HIDRAT|PROTETOR SOL'],
  ['Bebidas', 'CERV|REFRI|COCA\\b|COCA COLA|GUARANA|FANTA|SPRITE|SUCO|AGUA MIN|AGUA\\b|AGUA COCO|VINHO|VODKA|WHISK|GIN\\b|ENERG|CHA\\b|ISOTON|GATORADE|KOMBUCHA'],
  ['Congelados', 'CONG|PIZZA|LASANHA|SORVETE|HAMB|NUGGET|EMPANADO|BATATA PALITO|POLPA'],
  ['Doces e snacks', 'CHOC|BALA\\b|BALAS|BOMBOM|BISC|BOLACHA|WAFER|SALGADINHO|AMENDOIM|PIPOCA|DOCE|GELATINA|PUDIM|CHICLE|OREO|TRUFA|PACOCA|BARRA CER|BARRINHA'],
  ['Padaria', 'PAO\\b|PAES|BISNAG|BOLO|TORRADA|ROSCA|CROISSANT|SONHO\\b|FRANCES'],
  ['Frios e laticínios', 'LEITE\\b(?! COND)|LTE\\b|QUEIJO|QJO|MUSSAR|IOG|MANTEIGA|MARGAR|REQUEIJ|REQ\\b|CREME DE LEITE|CR LEITE|PRESUNTO|MORTADELA|SALAME|PEITO (DE )?PERU|BLANQUET|RICOTA|COALHADA|PETIT SUISSE|DANONE|NATA\\b|OVO|OVOS'],
  ['Carnes e peixes', 'CARNE|FRANGO|FGO\\b|PEITO|COXA|SOBRECOXA|ASA\\b|PATINHO|ACEM|ALCATRA|PICANHA|MAMINHA|FRALDINHA|COSTELA|CONTRA ?FILE|FILE|LOMBO|PERNIL|BISTECA|LINGUICA|LING\\b|SALSICHA|BACON|PEIXE|TILAPIA|SALMAO|CAMARAO|BOV|SUIN|MOIDA|CUPIM|MUSCULO|COPA LOMBO'],
  ['Mercearia', 'ARROZ|FEIJAO|MACARRAO|MAC\\b|ESPAGUETE|PENNE|OLEO|AZEITE\\b|ACUCAR|CAFE|FARINHA|FAR\\b|SAL\\b|MOLHO|EXTRATO|ATUM|SARDINHA|MILHO|ERVILHA|AVEIA|GRANOLA|ACHOC|NESCAU|TODDY|MAIONESE|KETCHUP|MOSTARDA|VINAGRE|TEMPERO|CALDO|FERMENTO|AMIDO|MAISENA|LENTILHA|GRAO|FUBA|TAPIOCA|POLVILHO|CEREAL|SOPA|MIOJO|LAMEN|PALMITO|AZEITONA|LEITE COND|CREME'],
  ['Hortifruti', 'BANANA|TOMATE|ALFACE|BATATA|CEBOLA|ALHO|MACA\\b|LARANJA|LIMAO|CENOURA|MAMAO|MELAO|MELANCIA|ABACAXI|UVA\\b|MORANGO|PERA\\b|MANGA\\b|ABOBRINHA|ABOBORA|PEPINO|PIMENTAO|BROCOLIS|COUVE|REPOLHO|MANDIOCA|AIPIM|BETERRABA|CHUCHU|BERINJELA|RUCULA|AGRIAO|CHEIRO VERDE|SALSINHA|COENTRO|KIWI|ABACATE|HORTI|FLV|LEGUME|FRUTA|VERDURA'],
].map(([c, s]) => [c, new RegExp('\\b(?:' + s + ')')]);
const sugereCat = nome => { const n = nk(nome); for (const [c, re] of MKEYS) if (re.test(n)) return c; return null; };
const DESC_NOTA = 'DESCONTO NA NOTA';
const fmtQ = (q, un) => /^KG$/i.test(un) ? (+q).toLocaleString('pt-BR', {maximumFractionDigits:2})+' kg' : (Math.round(q*10)/10).toLocaleString('pt-BR')+' '+(un ? un.toLowerCase() : 'un');
const median = a => { const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h-1] + s[h]) / 2; };

// Categoria: definida aqui (ainda não confirmada) > CATEGORIAS MERCADO > coluna CATEGORIA da linha > sugestão por palavra-chave
function catDe(r){
  if (r.item === DESC_NOTA) return {cat:'Descontos'};
  const lc = state.mercCat[r.k]; if (lc?.cat) return {cat:lc.cat};
  if (M.mercCat[r.k]) return {cat:M.mercCat[r.k]};
  if (r.catRow) return {cat:r.catRow};
  const s = sugereCat(r.item); return s ? {cat:s, auto:true} : {cat:'Sem categoria'};
}
let MC = null;
function mercado(){
  if (MC) return MC;
  const rows = M.mercado.map(r => ({...r}));
  const naPlan = new Set(rows.map(r => r.chave));
  for (const n of Object.values(state.mercLocal)){
    if (naPlan.has(n.chave)) continue;
    const d = parseDate(n.data) || TODAY, base = {data:d, ym:ymOf(d), loja:n.loja || '—', chave:n.chave, catRow:'', local:true};
    (n.itens || []).forEach(it => rows.push({...base, item:it.item, cod:it.cod || '', qtd:it.qtd ?? 1, un:it.un || '', unit:it.unit, total:+it.total || 0}));
    if (n.desconto > 0) rows.push({...base, item:DESC_NOTA, cod:'', qtd:1, un:'', unit:null, total:-n.desconto});
  }
  rows.forEach(r => { r.k = nk(r.item); r.desc = r.item === DESC_NOTA; const c = catDe(r); r.cat = c.cat; r.auto = !!c.auto; });
  const nm = {};
  rows.forEach(r => { const n = (nm[r.chave] ||= {chave:r.chave, data:r.data, ym:r.ym, loja:r.loja, itens:[], total:0, local:!!r.local}); n.itens.push(r); n.total += r.total; });
  MC = {rows, notas:Object.values(nm).sort((a, b) => b.data - a.data)};
  MC.ini = rows.length ? rows.reduce((a, r) => r.ym < a ? r.ym : a, CUR) : CUR;
  return MC;
}
function produtos(rows){
  const P = {};
  rows.forEach(r => { if (r.desc) return; const p = (P[r.k] ||= {k:r.k, nome:r.item, cat:r.cat, auto:r.auto, un:r.un, compras:[], total:0, qtd:0}); p.compras.push(r); p.total += r.total; p.qtd += r.qtd; });
  return Object.values(P).map(p => { p.ult = p.compras.reduce((a, r) => r.data > a.data ? r : a); return p; });
}
// preço por unidade de venda: por kg quando o item é vendido a peso, senão por unidade
const precoUnit = r => r.desc ? null : r.unit != null ? r.unit : r.qtd ? r.total/r.qtd : null;
const sufUnit = un => /^KG$/i.test(un) ? '/kg' : '/un';
const xpItem = r => ({data:r.data, desc:r.item, sub:[fmtQ(r.qtd, r.un), r.cat, r.loja].join(' · '), valor:r.total, unit:precoUnit(r), un:r.un});

// Itens e categorias pesando mais no mês de referência, e preços que subiram
function pesando(rows, ref, ini){
  const prev = ymRange(ymAdd(ref, -3), ymAdd(ref, -1)).filter(m => m >= ini);
  const out = [], parcial = ref === CUR ? ' até agora' : '';
  if (prev.length){
    const agrupa = kf => { const m = {}; rows.forEach(r => { if (r.desc) return; const o = (m[kf(r)] ||= {nome:r.item, un:r.un, cat:r.cat, ref:0, prev:0, qr:0, qp:0, its:[]}); if (r.ym === ref){ o.ref += r.total; o.qr += r.qtd; o.its.push(r); } else if (prev.includes(r.ym)){ o.prev += r.total; o.qp += r.qtd; } }); return m; };
    for (const [c, o] of Object.entries(agrupa(r => r.cat))){
      const avg = o.prev / prev.length;
      if (o.ref > avg*1.3 && o.ref - avg > 60) out.push({tone:o.ref > avg*1.6 ? 'red' : 'amber', ord:o.ref - avg,
        t:`${esc(c)}: ${fmt(o.ref)}${parcial} em ${ymLabel(ref, true)}`, d:`Média de ${fmt(avg)}/mês nos ${prev.length} meses anteriores${avg > 0 ? ` (+${pct(o.ref/avg - 1)})` : ''}.`,
        act:`<button class="btn sm" ${xp(c+' · '+ymLabel(ref, true), o.its.map(xpItem))}>ver itens</button>`});
    }
    for (const o of Object.values(agrupa(r => r.k))){
      const avg = o.prev / prev.length;
      if (o.ref > 30 && o.ref > avg*1.6 && o.ref - avg > 25) out.push({tone:avg > 0 && o.ref < avg*2.5 ? 'amber' : 'red', ord:o.ref - avg,
        t:`${esc(o.nome)}: ${fmt(o.ref)}${parcial} em ${ymLabel(ref, true)}`,
        d:avg > 0 ? `Média de ${fmt(avg)}/mês antes · ${fmtQ(o.qr, o.un)} agora contra ${fmtQ(o.qp/prev.length, o.un)}/mês nos ${prev.length} meses anteriores.` : `Não aparecia nas notas dos ${prev.length} meses anteriores.`,
        act:`<button class="btn sm" ${xp(o.nome+' · '+ymLabel(ref, true), o.its.map(xpItem))}>ver compras</button>`});
    }
  }
  const [y, m] = ref.split('-').map(Number), fim = ref === CUR ? TODAY : new Date(y, m-1, lastDay(y, m-1)), corte = addDays(fim, -45);
  produtos(rows.filter(r => r.data <= fim && r.data >= addDays(fim, -180) && r.unit > 0)).forEach(p => {
    const rec = p.compras.filter(r => r.data > corte), old = p.compras.filter(r => r.data <= corte);
    if (!rec.length || old.length < 2) return;
    const last = rec.reduce((a, r) => r.data > a.data ? r : a), med = median(old.map(r => r.unit)), v = last.unit/med - 1;
    if (v >= .1 && last.unit - med >= .3) out.push({tone:'blue', ord:-1/v,
      t:`Preço subiu: ${esc(p.nome)}`, d:`${fmt(last.unit)}${/KG/i.test(last.un) ? '/kg' : ''} em ${fmtDs(last.data)} (${esc(last.loja)}), contra ${fmt(med)} típico antes: +${pct(v)}.`,
      act:`<button class="btn sm" ${xp(p.nome+' · histórico de preço', p.compras.map(xpItem))}>histórico</button>`});
  });
  return out.sort((a, b) => (a.tone === 'blue') - (b.tone === 'blue') || b.ord - a.ord).slice(0, 9);
}

function cardAddNota(){
  const s = state.scanRes, url = state.settings.urlPagamentos;
  let res = '';
  if (s?.busy) res = `<div class="alert blue"><div><div class="tt">${s.msg || 'Consultando a nota na Sefaz…'}</div><div class="dd">Costuma levar de 5 a 20 segundos.</div></div></div>`;
  else if (s?.erro) res = `<div class="alert red"><div><div class="tt">Não consegui ler esta nota</div><div class="dd">${esc(s.erro)}.${s.link ? ` <a href="${esc(s.link)}" target="_blank" rel="noopener">Abra a nota no site da Sefaz</a>, selecione e copie a página inteira e use "Colar o texto da nota" abaixo.` : ''}</div></div><div class="act"><button class="btn sm" data-act="limparScan">Fechar</button></div></div>`;
  else if (s?.ok){
    const n = s.nota, t = sum(n.itens, i => +i.total || 0) - (n.desconto || 0);
    res = `<div class="alert green"><div><div class="tt">${s.repetida ? 'Esta nota já estava na planilha' : s.local ? 'Nota salva só neste navegador' : 'Nota gravada na planilha'}: ${esc(n.loja || 'mercado')} · ${esc(n.data || '')} · ${n.itens.length} ${n.itens.length === 1 ? 'item' : 'itens'} · ${fmt(t)}</div>
      <div class="dd">${n.itens.slice(0, 8).map(i => esc(i.item)).join(' · ')}${n.itens.length > 8 ? ' …' : ''}${n.desconto > 0 ? ` · desconto de ${fmt(n.desconto)}` : ''}</div></div><div class="act"><button class="btn sm" data-act="limparScan">OK</button></div></div>`;
  }
  return `<div class="card"><h2>Adicionar nota fiscal<span class="r">QR Code da NFC-e</span></h2>
    <div class="add-acts"><button class="btn pri" data-act="abrirCam">${ico('qr')}Câmera</button><button class="btn" data-act="foto">${ico('image')}Foto do QR Code</button>
      <div class="form-row"><input id="nota-link" placeholder="ou cole o link do QR Code" autocomplete="off"><button class="btn" data-act="linkNota">Ler</button></div></div>
    ${res ? `<div style="margin-top:14px">${res}</div>` : ''}
    <details class="mini" style="margin-top:14px" data-k="merc-txt" ${state.open['merc-txt'] ? 'open' : ''}><summary>Colar o texto da nota (quando a leitura automática não reconhece a página da Sefaz do seu estado)</summary>
      <div class="stack" style="margin-top:10px"><textarea id="nota-txt" placeholder="Abra a nota no site da Sefaz, selecione tudo (Ctrl+A ou ⌘A), copie e cole aqui"></textarea><div><button class="btn" data-act="colarNota">Ler texto e salvar</button></div></div></details>
    ${!url ? `<p class="note" style="margin-bottom:0">Falta publicar o script de gravação (Pagamentos.gs) e colar a URL dele em Configurações. Sem ele, o QR Code é lido mas os itens não podem ser buscados na Sefaz, e o texto colado fica salvo só neste navegador.</p>` : ''}
  </div>`;
}

const MTABS = [['resumo','Resumo'],['itens','Itens'],['cat','Categorizar'],['notas','Notas']];
function renderMercado(root){
  const {rows, notas, ini} = mercado();
  const ms = pMonths(), ref = refMonth();
  const R = rows.filter(r => ms.includes(r.ym)), N = notas.filter(n => ms.includes(n.ym));

  const tot = sum(R, r => r.total), mediaAnt = prev.length ? sum(prev, m => porMes[m] || 0)/prev.length : null, porMesPer = tot/ms.length;
  const P = produtos(rows), semCat = P.filter(p => p.cat === 'Sem categoria').length, sug = P.filter(p => p.auto).length;
  const despMerc = sum(ms.flatMap(gastos).filter(x => /MERCADO|SUPERMERC/.test(nk(x.cat))), proprio);
  const tab = MTABS.some(t => t[0] === state.mTab) ? state.mTab : 'resumo';
  let body = '';
  if (!rows.length) body = `<div class="card"><div class="empty">Nenhuma nota ainda. Escaneie o QR Code de uma nota fiscal do supermercado: os itens vão para a aba MERCADO da planilha e aparecem aqui, com comparação mês a mês.</div></div>`;
  else {
    const d = mediaAnt ? porMesPer/mediaAnt - 1 : null;
    body = `<div class="kpis">

      ${kpi({label:'Média dos 3 meses anteriores', value:mediaAnt == null ? '—' : fmt(mediaAnt), sub:d == null ? 'sem meses anteriores com notas' : `${ms.length > 1 ? 'por mês, o período está' : 'este mês está'} <b class="${d > .1 ? 'neg' : d < -.05 ? 'pos' : ''}">${d >= 0 ? '+' : ''}${pct(d)}</b>${ms.includes(CUR) ? ' (mês em andamento)' : ''}`})}
      ${kpi({label:'Produtos diferentes', value:produtos(R).length, sub:`${R.filter(r => !r.desc).length} itens nas notas do período`})}
      <div class="kpi click" data-act="mtab" data-t="cat"><div class="kpi-l"><span>Para categorizar</span><span class="why">abrir</span></div><div class="kpi-v ${semCat ? 'warn' : ''}">${semCat}</div><div class="kpi-s">${semCat ? 'produtos sem categoria' : 'tudo categorizado'}${sug ? ` · ${sug} sugest${sug === 1 ? 'ão' : 'ões'} a confirmar` : ''}</div></div>
    </div>

    <div class="tabs">${MTABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="mtab" data-t="${k}">${l}${k === 'cat' && semCat + sug ? ` <span class="badge amber">${semCat + sug}</span>` : ''}</button>`).join('')}</div>
    ${tab === 'resumo' ? mResumo(rows, ref, ini) : tab === 'itens' ? mItens(R, rows, ms) : tab === 'cat' ? mCat(rows) : mNotas(N)}`;
  }
  root.innerHTML = `${pageHead('Mercado', pLabel()+' · itens das notas fiscais do supermercado', `<button class="btn pri" data-act="abrirCam">${ico('qr')}Escanear nota</button>`)}
  ${cardAddNota()}${body}`;
}

function mResumo(rows, ref, ini){
  const al = pesando(rows, ref, ini);
  const tm = ymRange(ymAdd(ref, -5), ref).filter(m => m >= ini);
  const totCat = groupSum(rows.filter(r => tm.includes(r.ym) && !r.desc), r => r.cat, r => r.total);
  const ord = Object.keys(totCat).sort((a, b) => totCat[b] - totCat[a]), top = ord.slice(0, 7), grp = c => top.includes(c) ? c : 'Outras';
  const series = top.concat(ord.length > 7 ? ['Outras'] : []);
  chart('ch-merc', () => ({type:'bar', data:{labels:tm.map(m => ymLabel(m)), datasets:series.map((c, i) => ({label:c, data:tm.map(m => sum(rows.filter(r => r.ym === m && !r.desc && grp(r.cat) === c), r => r.total)), backgroundColor:catColors()[i % 10], borderRadius:2}))},
    options:{scales:{x:{stacked:true, grid:{display:false}}, y:{...moneyAxis, stacked:true}}, plugins:{legend:{position:'bottom'}}}}));
